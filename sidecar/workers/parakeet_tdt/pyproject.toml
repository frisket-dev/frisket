[project]
name = "frisket-parakeet-tdt"
version = "0.1.0"
description = "Fixed Parakeet TDT worker for Frisket transcription"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=14.0",
    "frisket-models",
    "huggingface-hub>=0.30",
    "nemo_toolkit[asr]>=2.7,<2.8",
    "numpy>=2.0",
    "onnx-asr>=0.11,<0.12",
    "onnxruntime>=1.20",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
frisket-models = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
