[project]
name = "frisket-vibevoice-asr"
version = "0.1.0"
description = "Fixed native VibeVoice-ASR GPU worker for Frisket transcription"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "frisket-models",
    "numpy==2.4.2",
]

[project.optional-dependencies]
gpu = [
    "torch==2.9.1",
    "transformers==5.3.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
frisket-models = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
