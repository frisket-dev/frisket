# Values come from frisket-install, release.env, or explicit operator input.
services:
  app:
    image: "${FRISKET_IMAGE:?Set FRISKET_IMAGE to the published Frisket image digest}"
    command: ["frisket", "server"]
    restart: unless-stopped
    environment:
      FRISKET_BASE_URL: "${FRISKET_BASE_URL:?Set FRISKET_BASE_URL}"
      FRISKET_DATA_DIR: /data
      FRISKET_TRUSTED_PROXY_CIDRS: "${FRISKET_TRUSTED_PROXY_CIDRS:-}"
      # Pair remote model URL and bearer; never send anonymous discovery.
      FRISKET_MODELS_URL: "${FRISKET_MODELS_URL:-}"
      FRISKET_MODELS_TOKEN: "${FRISKET_MODELS_TOKEN:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: "${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}"
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-frisket}"
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-otlp}"
      FRISKET_ASK_TRACE_CONTENT: "${FRISKET_ASK_TRACE_CONTENT:-false}"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
