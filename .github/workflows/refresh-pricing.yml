name: refresh-pricing
# One pricing-only PR, automatically merged after normal required checks.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pricing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate pricing publisher
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PRICING_APP_ID }}
          private-key: ${{ secrets.PRICING_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.publisher.outputs.token }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Refresh price table
        id: refresh
        run: |
          cp src/frisket/ai/llm/pricing_data.json /tmp/pricing_before.json
          uv run --no-project python scripts/dev/update_pricing.py
          pricing_changed="$(
            python3 - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("/tmp/pricing_before.json").read_text(encoding="utf-8"))
          after = json.loads(Path("src/frisket/ai/llm/pricing_data.json").read_text(encoding="utf-8"))
          if not isinstance(before, dict) or not isinstance(after, dict):
              raise TypeError("pricing data must be a JSON object")
          before_without_updated = dict(before)
          after_without_updated = dict(after)
          before_without_updated.pop("updated", None)
          after_without_updated.pop("updated", None)
          print("true" if before_without_updated != after_without_updated else "false")
          PY
          )"
          if [ "$pricing_changed" = "false" ]; then
            cp /tmp/pricing_before.json src/frisket/ai/llm/pricing_data.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            uv run --no-project python scripts/dev/pricing_delta_report.py \
              /tmp/pricing_before.json src/frisket/ai/llm/pricing_data.json \
              > /tmp/pricing_delta.md
          fi
      - name: Open PR
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          PRICING_CHANGED: ${{ steps.refresh.outputs.changed }}
        run: |
          pricing_path="src/frisket/ai/llm/pricing_data.json"
          today="$(date -u +%Y-%m-%d)"
          branch="pricing-refresh"

          changed_files="$(git diff --name-only HEAD; git ls-files --others --exclude-standard)"
          if [ -n "$changed_files" ] && [ "$changed_files" != "$pricing_path" ]; then
            echo "Refusing generated changes outside pricing_data.json" >&2
            exit 1
          fi

          if ! pr_number_output="$(
            gh pr list --state open --base main --head "$branch" \
              --json number --jq '.[].number'
          )"; then
            echo "Could not enumerate existing PRs for $branch" >&2
            exit 1
          fi
          mapfile -t pr_numbers < <(printf '%s' "$pr_number_output")
          if [ "${#pr_numbers[@]}" -gt 1 ]; then
            echo "Refusing ambiguous PR set for $branch" >&2
            exit 1
          fi

          remote_tip="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [ -n "$remote_tip" ]; then
            git fetch --no-tags origin "$remote_tip"
            branch_files="$(git diff --name-only "$(git merge-base HEAD "$remote_tip")" "$remote_tip")"
            if [ -n "$branch_files" ] && [ "$branch_files" != "$pricing_path" ]; then
              echo "Refusing existing branch changes outside pricing_data.json" >&2
              exit 1
            fi
          elif [ "${#pr_numbers[@]}" -eq 1 ]; then
            echo "Refusing open PR #${pr_numbers[0]} without its remote branch" >&2
            exit 1
          fi

          if [ "$PRICING_CHANGED" != "true" ]; then
            if [ "${#pr_numbers[@]}" -eq 1 ]; then
              gh pr close "${pr_numbers[0]}" --comment "Latest pricing matches main; closing the superseded refresh."
            fi
            exit 0
          fi

          cp "$pricing_path" /tmp/pricing_after.json
          git config user.name "pricing-refresh[bot]"
          git config user.email "actions@users.noreply.github.com"
          # HEAD is the trusted main checkout used to run the updater. Never
          # check out or execute the previous refresh branch's code.
          git switch -C "$branch"
          cp /tmp/pricing_after.json "$pricing_path"
          git add "$pricing_path"
          git commit -m "chore(pricing): nightly refresh from the LiteLLM registry"
          git push --set-upstream \
            --force-with-lease="refs/heads/$branch:$remote_tip" \
            origin "HEAD:refs/heads/$branch"
          head_sha="$(git rev-parse HEAD)"
          if [ "${#pr_numbers[@]}" -eq 0 ]; then
            pr="$(gh pr create --title "Pricing refresh $today" \
              --body-file /tmp/pricing_delta.md --base main --head "$branch")"
          else
            pr="${pr_numbers[0]}"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              --raw-field "body=$(cat /tmp/pricing_delta.md)" >/dev/null
          fi
          gh pr merge "$pr" --auto --squash --match-head-commit "$head_sha"
