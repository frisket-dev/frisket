name: refresh-pricing

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-pricing
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/refresh-catalog.yml
    with:
      mode: pricing
