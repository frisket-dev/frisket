name: ci

permissions:
  contents: read
on:
  # `labeled` lets adding `ci:full` rerun the PR with the complete suite; any
  # other label reruns the same fast tier.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

# A superseding run on the same ref obsoletes the in-flight run. Each merge
# group runs on its own queue ref, never sharing a group with PR or push runs,
# and a queue run is never cancelled from here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  # A dependency download slower than uv's 30-second default must not fail the job.
  UV_HTTP_TIMEOUT: "120"

jobs:
  queue-tested:
    permissions:
      actions: read
    uses: ./.github/workflows/queue-tested.yml
    with:
      workflow: ci.yml
      job: ci-pass

  # Coarse path classification for per-layer test selection. Diff-based and
  # dependency-free; it FAILS OPEN (runs everything) whenever the base commit
  # cannot be resolved. Merge-queue runs, manual dispatches, pushes to main and
  # pull requests labelled `ci:full` run every layer (the complete suite);
  # other pull requests get the fast tier. A push to main whose exact commit
  # already passed this workflow in the merge queue runs no layer: that queue
  # run is its complete suite.
  #
  # The fast PR tier is feedback only, because the merge queue runs the
  # complete suite on exactly what lands: every lint, ratchet and type check,
  # the sidecar/postgres/web jobs as their layers select them, and the Python
  # test directories that correspond to the changed source areas (`select`
  # step). The execution-core shard runs only when its own area changed, and
  # the browser journeys only when their specs, harness or Playwright pin
  # changed. Two independent filter outputs:
  #   * job gates (backend/frontend/infra) skip a whole job a commit
  #     provably cannot affect -- e.g. a frontend-only commit skips the Python
  #     suite; a backend-only commit skips the web vitest+build.
  #   * pytest_target selects the Python suite subset: `tests` (the complete
  #     suite) for every full-tier run, and on a fast-tier PR whenever a change
  #     reaches the whole package -- dependencies, test configuration, shared
  #     test helpers, package data, a top-level module, or anything the wheel
  #     ships or builds from. Otherwise it names the test directory of each
  #     changed source area (`src/frisket/<area>/` -> `tests/<area>`, a change
  #     under `tests/<dir>/` -> that directory) plus the root tests, which host
  #     the boundary, workflow, script and cross-cutting suites. The `select`
  #     step falls back to the complete suite when a named directory holds no
  #     tests. The ruff/rule-19/deterministic-time lints and the import-boundary
  #     gate stay unconditional regardless of this subset.
  changes:
    needs: queue-tested
    runs-on: ubuntu-24.04
    env:
      # Every run except an unlabelled pull request runs the complete suite.
      FULL_SUITE: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
      models_gpu: ${{ steps.filter.outputs.models_gpu }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      pytest_target: ${{ steps.filter.outputs.pytest_target }}
      engine_tests: ${{ steps.select.outputs.engine_tests }}
      surface_tests: ${{ steps.select.outputs.surface_tests }}
      gap_tests: ${{ steps.select.outputs.gap_tests }}
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          QUEUE_TESTED: ${{ needs.queue-tested.outputs.tested }}
        run: |
          set -euo pipefail
          if [ "${QUEUE_TESTED:-}" = "true" ]; then
            printf '%s=false\n' backend sidecar models_gpu frontend infra >> "$GITHUB_OUTPUT"
            echo "pytest_target=tests" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          allchanged=0
          if [ "$EVENT_NAME" = "pull_request" ] && [ "${FULL_SUITE:-false}" != "true" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ] || [ "${FULL_SUITE:-false}" = "true" ] \
            || { [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            # Every releasable main commit gets the complete suite, here or in
            # the queue run that tested this exact commit; so does a PR
            # labelled `ci:full`. Other PRs get the fast tier.
            allchanged=1
            base=""
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            allchanged=1
            files=""
          else
            files="$(git diff --name-only "$base" HEAD)"
          fi
          match() {
            if [ "$allchanged" = "1" ]; then echo true; return; fi
            # Drain the whole diff: grep -q can SIGPIPE printf under pipefail.
            if printf '%s\n' "$files" | grep -E "$1" >/dev/null; then echo true; else echo false; fi
          }
          # backend = anything the Python suite can depend on, including the
          # web/sdk TS toolchain the renderer-matrix/plugin-build tests shell
          # out to (a web/src-only change does NOT flip this).
          backend_re='^(src/|tests/|sidecar/|scripts/|deploy/release/|\.github/|pyproject\.toml|uv\.lock|web/package(-lock)?\.json|web/tsconfig.*\.json|sdk/package(-lock)?\.json|sdk/tsconfig.*\.json)'
          backend="$(match "$backend_re")"
          # `sidecar/` is its own uv project and is deliberately excluded from
          # the root pytest collection. Keep its light contract suite visible
          # whenever the sidecar (including its shared transcription fixtures
          # under sidecar/tests/fixtures/), the app's mirror copy of the
          # contract (transcription_sidecar.py --
          # sidecar/tests/test_contract_mirror_parity.py loads it by file path
          # since the sidecar venv never installs the frisket package; a
          # root-pytest-only run cannot see an app-copy-only drift), or this
          # workflow changes.
          sidecar="$(match '^(sidecar/|src/frisket/contracts/transcription_sidecar\.py|\.github/workflows/ci\.yml)')"
          # Executable deployment validation owns the standalone GPU host
          # artifacts; pure topology edits do not need either Python suite.
          models_gpu="$(match '^(docker-compose\.models-gpu\.yml|deploy/Caddyfile\.models-gpu|scripts/ci/validate_models_gpu_topology\.sh|\.github/workflows/ci\.yml)$')"
          # The transcription fallback artifact is backend-owned but imported
          # directly by the web bundle, so its changes must run the web build.
          frontend="$(match '^(web/|sdk/|src/frisket/data/transcribe_builtin_declarations\.json$|src/frisket/data/plugin_sdk\.mjs$|src/frisket/authoring/bundled_plugins/frisket\.geo/\.frisket-sdk/index\.mjs$)')"
          infra="$(match '^(\.github/|scripts/|pyproject\.toml|uv\.lock)')"
          target="tests"
          if [ "$allchanged" = "0" ] && [ -n "$files" ]; then
            whole=0
            mapped=0
            dirs=""
            while IFS= read -r f; do
              dir=""
              case "$f" in
                # Whole-package inputs: dependencies, test configuration and
                # everything the wheel ships or builds from.
                pyproject.toml|uv.lock|conftest.py|hatch_build.py|scripts/build_vec1.py|vendor/*|sidecar/*|src/frisket/data/*|tests/conftest.py)
                  whole=1 ;;
                src/frisket/*/*)
                  area="${f#src/frisket/}"
                  dir="tests/${area%%/*}" ;;
                # Top-level modules have no test directory of their own.
                src/*) whole=1 ;;
                tests/test_*.py) mapped=1 ;;
                tests/*/*)
                  area="${f#tests/}"
                  dir="tests/${area%%/*}" ;;
                # Shared helpers at the root of tests/.
                tests/*) whole=1 ;;
                # Scripts, workflows, release tooling and the TS toolchain pins
                # are covered by the root tests.
                scripts/*|.github/*|deploy/release/*|web/package*.json|web/tsconfig*.json|sdk/package*.json|sdk/tsconfig*.json)
                  mapped=1 ;;
              esac
              if [ -n "$dir" ]; then
                mapped=1
                case " $dirs " in *" $dir "*) : ;; *) dirs="$dirs $dir" ;; esac
              fi
            done <<< "$files"
            if [ "$whole" = "0" ] && [ "$mapped" = "1" ]; then
              dirs="${dirs# }"
              target="${dirs:+$dirs }tests/*.py"
            fi
          fi
          {
            echo "backend=$backend"
            echo "sidecar=$sidecar"
            echo "models_gpu=$models_gpu"
            echo "frontend=$frontend"
            echo "infra=$infra"
            echo "pytest_target=$target"
          } >> "$GITHUB_OUTPUT"
      # Splits pytest_target across the two Python shards and decides the
      # browser journeys. On the fast PR tier the journeys run only when their
      # own inputs change: the specs and Playwright configs, the e2e backend
      # harness, the Playwright pin, or this workflow.
      - id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_TESTED: ${{ needs.queue-tested.outputs.tested }}
          TARGET: ${{ steps.filter.outputs.pytest_target }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "${QUEUE_TESTED:-}" = "true" ]; then
            printf '%s\n' engine_tests=false surface_tests= gap_tests= e2e=false >> "$GITHUB_OUTPUT"
            echo "### ci: this commit passed the complete suite in the merge queue; no test job reruns" >> "$summary"
            exit 0
          fi
          if [ "${FULL_SUITE:-false}" = "true" ]; then
            tier="complete suite"
            e2e=true
          else
            tier="fast PR tier"
            e2e=false
            e2e_inputs='^(web/tests/e2e/|web/playwright/|scripts/e2e/|web/package(-lock)?\.json$|\.github/workflows/ci\.yml$)'
            if [ -z "$PR_BASE_SHA" ] || ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
              e2e=true
            elif git diff --name-only "$PR_BASE_SHA" HEAD | grep -E "$e2e_inputs" >/dev/null; then
              e2e=true
            fi
          fi
          set -f
          engine=false
          surface=""
          if [ "$TARGET" = "tests" ]; then
            engine=true
            surface="tests --ignore=tests/engine"
            gap="tests"
          else
            gap="$TARGET"
            for path in $TARGET; do
              if [ "$path" = "tests/*.py" ]; then
                surface="$surface $path"
              elif [ -z "$(find "$path" -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
                # A changed directory without tests of its own (shared
                # fixtures, data, a deleted suite) reaches the whole package.
                engine=true
                surface="tests --ignore=tests/engine"
                gap="tests"
                break
              elif [ "$path" = "tests/engine" ]; then
                engine=true
              else
                surface="$surface $path"
              fi
            done
            surface="${surface# }"
          fi
          {
            echo "engine_tests=$engine"
            echo "surface_tests=$surface"
            echo "gap_tests=$gap"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"
          # A fast-tier skip is deferred to the merge queue, which runs every
          # job below on what lands; "not affected" means this diff does not
          # reach the job at all.
          deferred="skipped on this PR: runs in the merge queue (add the \`ci:full\` label to run it here)"
          unaffected="skipped: not affected by this diff (the merge queue still runs the complete suite)"
          plan() {
            if [ "$2" = "true" ]; then echo "| $1 | runs |"
            elif [ "$3" = "deferred" ]; then echo "| $1 | $deferred |"
            else echo "| $1 | $unaffected |"; fi
          }
          python_deferred=unaffected
          [ "$BACKEND" = "true" ] && python_deferred=deferred
          e2e_layer=unaffected
          { [ "$BACKEND" = "true" ] || [ "$FRONTEND" = "true" ]; } && e2e_layer=deferred
          {
            echo "### ci: $tier"
            echo
            echo "| Job | This run |"
            echo "| --- | --- |"
            plan "Python tests (execution core)" "$([ "$BACKEND" = true ] && echo "$engine" || echo false)" "$python_deferred"
            if [ "$BACKEND" = "true" ]; then
              echo "| Python tests (product surfaces) | runs \`$surface\`; gap subset over \`$gap\` |"
            else
              plan "Python tests (product surfaces)" false unaffected
            fi
            plan "deploy-smoke, e2e-cassette-core" "$([ "$e2e_layer" = deferred ] && echo "$e2e" || echo false)" "$e2e_layer"
          } >> "$summary"
  models-gpu-topology:
    needs: changes
    if: ${{ needs.changes.outputs.models_gpu == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: scripts/ci/validate_models_gpu_topology.sh
  sidecar-contract:
    needs: changes
    if: ${{ needs.changes.outputs.sidecar == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --dev
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      # Scoped to the shared sidecar tests: the Whisper Turbo leaf
      # below runs in its OWN locked env, and collecting it here imports a
      # package the shared env deliberately does not install.
      - run: uv run --no-sync pytest -q tests
      - run: uv run --no-sync python ../scripts/ci/check_test_collection.py --sidecar
      # The CUDA worker is an isolated locked leaf. Its tests are CPU mocks,
      # but installing its own environment catches dependency/API drift that
      # the intentionally light shared sidecar environment cannot see.
      - run: uv sync --project workers/whisper_turbo --locked --dev
      - run: uv run --project workers/whisper_turbo --no-sync ruff check workers/whisper_turbo
      - run: uv run --project workers/whisper_turbo --no-sync ruff format --check workers/whisper_turbo
      - run: uv run --project workers/whisper_turbo --no-sync pytest -q workers/whisper_turbo/tests
      # The VibeVoice leaf keeps model dependencies in its GPU extra; these
      # tests exercise the worker contract without weights or a CUDA install.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --project workers/vibevoice_asr --locked --dev
      - run: uv run --project workers/vibevoice_asr --no-sync ruff check workers/vibevoice_asr
      - run: uv run --project workers/vibevoice_asr --no-sync ruff format --check workers/vibevoice_asr
      - run: uv run --project workers/vibevoice_asr --no-sync pytest -q workers/vibevoice_asr/tests
  python-quality:
    needs: changes
    # Run source-quality and architectural checks once, independently of the
    # pytest shards below.
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --dev --extra entities
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      # Test token rules: no reads of repository source (`# rule19:`), no
      # raw sleep/monotonic/Thread (`# realtime:`), no sys.executable spawns
      # (`# subprocess-boundary:`); their allowlists only shrink.
      - run: uv run --no-sync python scripts/ci/lint_test_tokens.py
      - run: uv run --no-sync python scripts/ci/check_cell_write_ownership.py
      # The routed dispatch files may read only their pinned pre-route env
      # fallbacks; placement facts arrive on the ConnectionConfig.
      - run: uv run --no-sync python scripts/ci/lint_placement_env_reads.py
      - run: uv run --no-sync python scripts/ci/lint_no_internal_paths.py
      # Registered ActionPrechecks receive the pydantic-validated ActionSpec;
      # container-type re-guards on params are unreachable and stay deleted
      # (WARM-01).
      - run: uv run --no-sync python scripts/ci/lint_precheck_container_guards.py
      # Routes map an exception type to HTTP once (register_typed_error) or
      # raise RouteError; the per-handler idioms only shrink.
      - run: uv run --no-sync python scripts/ci/lint_route_error_idioms.py
      # Import-boundary gate: the declarative rules in
      # scripts/ci/import_boundaries.json checked against the real source tree
      # (the single boundary system).
      - run: uv run --no-sync python scripts/ci/check_import_boundaries.py --source-root src --config scripts/ci/import_boundaries.json
      # Shrink-only cleanup ratchets: frozen ruff complexity/argument/
      # local-import counts, symbols and modules production never reaches
      # (tests do not count), and near-duplicate functions.
      - run: uv run --no-sync python scripts/ci/ruff_ratchet.py
      - run: uv run --no-sync python scripts/ci/check_dead_symbols.py
      - run: uv run --no-sync python scripts/ci/check_duplicate_functions.py
      # Suppression comments, debt skips and history comments only shrink
      # (Python and TS; the web job runs both too so frontend-only changes
      # are counted).
      - run: uv run --no-sync python scripts/ci/check_suppressions.py
      - run: uv run --no-sync python scripts/ci/lint_comment_history.py
      # Words GLOSSARY.md rejects, in user-facing text and declared names, only shrink.
      - run: uv run --no-sync python scripts/ci/lint_glossary_avoid.py
      # Pinned pyright (pyrightconfig.json, basic mode) over src/frisket:
      # per-file error counts only shrink. Measured in this job's environment.
      - name: Type-checker ratchet
        run: uv run --no-sync python scripts/ci/type_ratchet.py
      # Every tests/ test file is collected by pytest (default and opt-in
      # marker runs); the sidecar and web jobs check their own runners.
      - run: uv run --no-sync python scripts/ci/check_test_collection.py --python

  test-engine:
    name: Python tests (execution core)
    needs: changes
    # Runs with the complete suite, and on a fast-tier PR only when the
    # selection names tests/engine; other PRs leave this shard to the queue.
    if: ${{ needs.changes.outputs.backend == 'true' && needs.changes.outputs.engine_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg ripgrep
      - run: uv sync --dev --extra entities
      - run: uv run --no-sync python scripts/build_vec1.py
      # Real RapidOCR tests skip when model files are absent; CI does not
      # hydrate third-party weights.
      # keyless by design: replay_strict against the committed response cache.
      # No -m override here: pyproject.toml's addopts ("not gap and not
      # network and not plugin_contract") is the real default subset --
      # respecifying "-m not network" on the command line replaces rather
      # than composes with addopts, silently letting the 18 plugin_contract
      # gauntlet tests (deliberately isolated from the default suite) back in.
      - run: FRISKET_CHECKLOG_DISABLE=1 uv run --no-sync pytest tests/engine -q -n auto --dist loadfile --durations=50 --durations-min=0.5 -o faulthandler_timeout=120

  test:
    name: Python tests (product surfaces)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTEST_TARGET: ${{ needs.changes.outputs.surface_tests }}
      GAP_TARGET: ${{ needs.changes.outputs.gap_tests }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # Root contract-renderer and plugin-build tests need both checked-in
      # JavaScript toolchains.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            sdk/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: sdk
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg ripgrep
      - run: uv sync --dev --extra entities
      - run: uv run --no-sync python scripts/build_vec1.py
      # The selection is a word list whose `tests/*.py` must glob.
      - run: |
          # shellcheck disable=SC2086  # intentional word split and glob of the selection
          FRISKET_CHECKLOG_DISABLE=1 uv run --no-sync pytest $PYTEST_TARGET -q -n auto --dist loadfile --durations=50 --durations-min=0.5 -o faulthandler_timeout=120
      # The ordinary suite excludes gap tests. Run the keyless acceptance
      # subset separately, using the same file-level parallelism. Tests marked
      # gap_env need a prepared environment and remain outside this stock job.
      # This marker expression replaces pyproject.toml's default expression.
      # It covers the same directories as the run above, plus tests/engine.
      - run: |
          # shellcheck disable=SC2086  # intentional word split and glob of the selection
          uv run --no-sync pytest -q -n auto --dist loadfile -m "gap and not gap_env" $GAP_TARGET --durations=20 --durations-min=0.5
  deploy-smoke:
    needs: changes
    # Full-stack browser journey: run for any backend or frontend change; a
    # docs-only commit cannot alter the journey, so it skips. A fast-tier PR
    # runs it only when its own inputs change (`select` step).
    if: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && needs.changes.outputs.e2e == 'true' }}
    # One keyless browser journey through the real local stack: health,
    # project creation, CSV import, deterministic regex action, and persisted
    # result readback. Keep the provider-backed/full e2e suite local-only.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # This one journey uses only the base application surface (project/CSV/
      # deterministic regex). Keep dev, convert, and entities/PyICU out of the
      # environment; e2e_backend.sh's explicit minimal mode then uses this
      # already-synced environment without silently restoring those groups.
      - run: uv sync --frozen --no-dev
      # Playwright recommends installing the single required browser with its
      # OS dependencies in CI; caching the browser archive is not worthwhile
      # on hosted Linux runners, while the npm download cache above is.
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: FRISKET_E2E_MINIMAL_DEPS=1 npm run e2e:smoke
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: deploy-smoke-failure
          path: |
            web/test-results/
            .frisket/e2e-duration-*
          if-no-files-found: ignore
          retention-days: 7
  e2e-cassette-core:
    needs: changes
    # Same trigger shape as deploy-smoke: any backend or frontend change; a
    # docs-only commit cannot alter these journeys, so it skips. A fast-tier
    # PR runs them only when their own inputs change (`select` step).
    if: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && needs.changes.outputs.e2e == 'true' }}
    # Keyless core e2e: specs create their own projects and, when needed,
    # prime the committed-response LLM cache (ResponseCache) before running, so
    # every "model" call replays from the cassette. Keyless BY CONSTRUCTION,
    # twice over: --no-deps skips the chromium project's `seed` dependency, so
    # seed.setup.ts (real ~$0.25 model calls) can never fire, and
    # FRISKET_CACHE_MODE=replay_strict pins the backend to the cache-only
    # posture — a cache miss raises typed CacheMiss instead of calling any
    # provider (`replay_strict_cannot_egress`, engine/runner/validation.py),
    # so no run here can spend or egress. The validation form proof makes no
    # model calls; the full provider-backed suite stays local-only.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # These journeys use only the base application surface plus the primed
      # response cache. Same minimal environment as deploy-smoke:
      # e2e_backend.sh's FRISKET_E2E_MINIMAL_DEPS mode boots frisket with
      # --no-sync against this already-synced env.
      - run: uv sync --frozen --no-dev
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # The self-booting stack (playwright.config.ts webServer) starts backend
      # + vite itself; no hand-started processes. FRISKET_CACHE_MODE is
      # inherited by the webServer backend command, so the server-side cost/
      # key gates see the strict-replay proof and admit the keyless cassette.
      - run: >
          UV_NO_SYNC=1 FRISKET_E2E_MINIMAL_DEPS=1 FRISKET_CACHE_MODE=replay_strict
          npm run e2e --
          --project=chromium --no-deps --workers=1
          action-compare-connected.spec.ts
          action-compare-extract.spec.ts
          action-compare-eval.spec.ts
          action-validation-ux.spec.ts
          ask-skill-authoring.spec.ts
          backfill-cost-gate.spec.ts
          derive-object-list.spec.ts
          explain-cell.spec.ts
          extraction-text-citations.spec.ts
          golden-extract-people-search.spec.ts
          import-csv-upload.spec.ts
          project-ask.spec.ts
          review-rendering.spec.ts
          search-preparation-progress.spec.ts
          sheet-tab-overflow.spec.ts
          workbench-ia-sheet-tabs.spec.ts
        working-directory: web
      # Exercise the built Solo app against a fake external Cloud service.
      # Connection storage, routing, the selector, and SPA refresh stay real.
      - name: Cloud connection and credit routing
        run: |
          node ../sdk/scripts/gen-contracts.mjs
          FRISKET_EDITION=local npx vite build
          UV_NO_SYNC=1 npx playwright test --config playwright/playwright.cloud-connection.config.ts
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: e2e-cassette-core-failure
          path: |
            web/test-results/
            .frisket/e2e-duration-*
          if-no-files-found: ignore
          retention-days: 7
  postgres:
    needs: changes
    # Pure Python job (pytest tests/engine/test_job_queue.py). Skip on frontend-only
    # or docs-only commits that cannot touch the queue schema.
    if: ${{ needs.changes.outputs.backend == 'true' }}
    # The base `test` job builds the control plane fresh from `metadata` via
    # create_all() on SQLite, so it can NEVER see schema/dialect drift between
    # the SQLite test env and the Postgres prod env. This job runs the gated
    # real-Postgres tests against a service container so that drift (e.g. a
    # model column with no migration helper, or a SQLite-only column type
    # emitted on Postgres) is caught pre-merge.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: frisket, POSTGRES_PASSWORD: frisket, POSTGRES_DB: frisket}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frisket -d frisket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FRISKET_PG_TEST_URL: postgresql+psycopg://frisket:frisket@localhost:5432/frisket
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      # psycopg[binary] is a core dependency, so no apt/extras are needed here
      - run: uv sync --dev
      # gated on FRISKET_PG_TEST_URL: the control-plane migration/dialect
      # regression plus the real SKIP LOCKED job-queue and invite-authority
      # concurrency tests
      - run: uv run --no-sync pytest -q tests/engine/test_job_queue.py tests/team/test_invite_authority_postgres.py
  web:
    needs: changes
    # Frontend lint + unit/component suite + build; depends on web/sdk sources and
    # the one backend-owned declaration artifact imported by the bundle. Also
    # runs on CI-infra changes. Other backend-only Python changes skip it.
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            sdk/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: sdk
      - name: Verify vendored plugin SDK freshness
        run: |
          set -euo pipefail
          sdk_vendor="src/frisket/data/plugin_sdk.mjs"
          sdk_geo_vendor="src/frisket/authoring/bundled_plugins/frisket.geo/.frisket-sdk/index.mjs"
          sdk_vendor_snapshot="$(mktemp)"
          restore_sdk_vendor() {
            cp "$sdk_vendor_snapshot" "$sdk_vendor"
          }
          cp "$sdk_vendor" "$sdk_vendor_snapshot"
          trap restore_sdk_vendor EXIT
          npm --prefix sdk run build
          cp "$sdk_vendor_snapshot" "$sdk_vendor"
          cmp sdk/dist/index.mjs "$sdk_vendor"
          cmp "$sdk_vendor" "$sdk_geo_vendor"
      # The real-served-catalog battery in v1ActionSpecContract.test.ts projects
      # the catalog through the backend, so this job needs frisket importable.
      # Those cases self-skip without it -- and a battery that silently skips in
      # CI is how a synthetic fixture shipped a paid-provider regression once.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen --no-dev
      - run: python3 scripts/ci/lint_web_source_hygiene.py
      - run: python3 scripts/ci/check_suppressions.py
      - run: python3 scripts/ci/lint_comment_history.py
      - run: npm run lint
        working-directory: web
      # Vitest and Playwright transpile without type-checking; per-file
      # TypeScript error counts in web/tests only shrink.
      - run: python3 scripts/ci/web_tests_type_ratchet.py
      - run: python3 scripts/ci/check_test_collection.py --web
      # Run the full frontend unit/component suite separately from the build:
      # TypeScript and bundling checks do not execute behavioral tests.
      - run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web
      # The separate deploy-smoke job owns the one keyless Playwright journey.
      # The full 279-spec provider-backed/local suite remains deliberately
      # unwired here; this job only owns frontend unit tests and the build.

  ci-pass:
    name: ci-pass
    if: ${{ always() }}
    needs: [queue-tested, changes, models-gpu-topology, sidecar-contract, python-quality, test-engine, test, deploy-smoke, e2e-cassette-core, postgres, web]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '.changes.result == "success" and ([.[] .result] | all(. == "success" or . == "skipped"))' <<< "$RESULTS"
      # Why each skipped job skipped is in the `changes` job summary.
      - if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
