name: local-model-runtime

# Pull requests and merge queue entries always run this workflow so the
# `local-model-runtime` check reports on every change; the `changes` job
# decides whether the install proofs below are needed.
on:
  workflow_dispatch:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Each merge group has its own queue ref; a queue run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  # A dependency download slower than uv's 30-second default must not fail the job.
  UV_HTTP_TIMEOUT: "120"

jobs:
  # Decides whether this run needs the install proofs: on pull requests and
  # in the merge queue only when the diff changes one of their inputs (the
  # pattern below), otherwise always.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
      reason: ${{ steps.paths.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # The proofs' inputs: the model runtime installers, launcher and
          # supervisor, the native model workers, the sidecar model packages
          # and their constraints and lock, the smoke scripts, the package
          # metadata, and this workflow.
          inputs='^(\.github/workflows/local-model-runtime\.yml|src/frisket/runtime/(model_[^/]*\.py|classifier_install\.py|embeddinggemma_install\.py|_bootstrap\.py|_environment_use\.py|launch\.py|supervisor\.py|_guard[^/]*)|src/frisket/engine/_workers/(classifier_[^/]*\.py|embeddinggemma_[^/]*\.py|framing\.py)|src/frisket/retrieval/encoding\.py|sidecar/src/frisket_models/(local\.py|engines\.py|classification/.*)|sidecar/(classify-constraints\.txt|retrieval-constraints\.txt|retrieval-runtime/.*|uv\.lock|pyproject\.toml)|scripts/smoke/(retrieval_runtime|local_model_server|prefetch_docling_models)\.py|pyproject\.toml)$'
          relevant=true
          if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != merge_group ]; then
            reason="this $EVENT_NAME run proves the revision in full"
          else
            if [ "$EVENT_NAME" = merge_group ]; then base="${QUEUE_BASE_SHA:-}"; else base="${BASE_SHA:-}"; fi
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              reason="the diff base is unavailable, so the proofs run"
            else
              files="$(git diff --name-only "$base" HEAD)"
              if hit="$(grep -E "$inputs" <<< "$files")"; then
                reason="this diff changes an input of the proofs: ${hit%%$'\n'*}"
              else
                relevant=false
                reason="not affected: this diff changes no input of the install proofs"
              fi
            fi
          fi
          {
            echo "relevant=$relevant"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "### local-model-runtime ($EVENT_NAME): $reason" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  retrieval:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv build --wheel --out-dir dist
      # Install the exact frozen runtime through the product lifecycle. This
      # intentionally downloads packages but not model weights, and never
      # sends an encode request.
      - name: Install and start the multimodal retrieval runtime
        shell: python
        run: |
          import os
          import platform
          from pathlib import Path
          import subprocess
          import sys

          if sys.platform == "darwin":
              assert platform.machine() == "arm64", "Desktop supports Apple Silicon"
          if sys.platform == "win32":
              assert platform.machine().lower() in {"amd64", "x86_64"}

          repo = Path.cwd()
          wheel = next((repo / "dist").glob("*.whl"))
          root = Path(os.environ["RUNNER_TEMP"]) / "retrieval-runtime-proof"
          root.mkdir()
          subprocess.run(["uv", "venv", str(root / "app")], check=True)
          python = root / "app" / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run(["uv", "pip", "install", "--python", str(python), str(wheel)], check=True)
          env = os.environ.copy()
          env["FRISKET_MODEL_RUNTIME_DIR"] = str(root / "runtime")
          env["HF_HUB_DISABLE_TELEMETRY"] = "1"
          env["HF_HUB_OFFLINE"] = "1"
          env["TRANSFORMERS_OFFLINE"] = "1"
          os.chdir(root)
          subprocess.run(
              [str(python), "-I", str(repo / "scripts/smoke/retrieval_runtime.py")],
              check=True,
              env=env,
          )

  classifiers:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv build --wheel --out-dir dist
      # Public package downloads only: no weights, keys, or application data.
      - name: Install and probe the classifier profile from the wheel
        shell: python
        run: |
          import os
          import platform
          from pathlib import Path
          import subprocess
          import sys

          if sys.platform == "darwin":
              assert platform.machine() == "arm64", "Desktop supports Apple Silicon"
          if sys.platform == "win32":
              assert platform.machine().lower() in {"amd64", "x86_64"}

          repo = Path.cwd()
          wheel = next((repo / "dist").glob("*.whl"))
          root = Path(os.environ["RUNNER_TEMP"]) / "classifier-proof"
          root.mkdir()
          subprocess.run(["uv", "venv", str(root / "app")], check=True)
          python = root / "app" / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run(["uv", "pip", "install", "--python", str(python), str(wheel)], check=True)
          os.environ["FRISKET_MODEL_RUNTIME_DIR"] = str(root / "runtime")
          os.environ["HF_HUB_DISABLE_TELEMETRY"] = "1"
          os.chdir(root)
          subprocess.run([str(python), "-I", "-c", "\n".join([
              "from frisket.runtime.classifier_install import install_classifiers, is_installed, runtime_python",
              "import subprocess",
              "install_classifiers(should_cancel=lambda: False, progress=print)",
              "assert is_installed()",
              "subprocess.run([str(runtime_python()), '-I', '-c', "
              "'from frisket_models.classification import GLiClassBase, Jeff; "
              "from frisket_models.classification._jeff_inference import DecisionModel; "
              "assert GLiClassBase and Jeff and DecisionModel'], check=True)",
          ])], check=True)

  docling:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv build --wheel --out-dir dist
      # This installed-product proof needs public package/model downloads,
      # unlike the network-free unit suite. It receives no application secrets.
      - name: Install the wheel and convert real text and scanned PDFs
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          repo = Path.cwd()
          wheel = next((repo / "dist").glob("*.whl"))
          root = Path(os.environ["RUNNER_TEMP"]) / "docling-proof"
          root.mkdir()
          subprocess.run(["uv", "venv", str(root / "app")], check=True)
          python = root / "app" / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run(["uv", "pip", "install", "--python", str(python), str(wheel)], check=True)
          os.environ["FRISKET_MODEL_RUNTIME_DIR"] = str(root / "runtime")
          os.environ["HF_HUB_DISABLE_TELEMETRY"] = "1"
          os.chdir(root)
          subprocess.run([
              str(python), "-I", str(repo / "scripts/smoke/local_model_server.py"),
              "--lifecycle-install", "--text-pdf",
              str(repo / "tests/fixtures/pdf_tables/simple_table.pdf"),
          ], check=True)

  # The required check. It fails unless `changes` succeeded and every proof
  # passed or was deliberately skipped; its summary says why they skipped.
  local-model-runtime:
    name: local-model-runtime
    if: ${{ always() }}
    needs: [changes, retrieval, classifiers, docling]
    runs-on: ubuntu-26.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "### $GITHUB_JOB: ${REASON:-the change filter did not finish}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          jq -e '.changes.result == "success" and ([.[] .result] | all(. == "success" or . == "skipped"))' <<< "$RESULTS"
