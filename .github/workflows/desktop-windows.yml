name: desktop-windows

on:
  workflow_call:
    inputs:
      nightly:
        description: "Prove the unsigned installed app on this revision regardless of the diff (the nightly platform run)"
        required: false
        default: false
        type: boolean
    outputs:
      source_sha:
        description: "Revision verified by the signed installed-app proof"
        value: ${{ jobs.signed-installed-proof.outputs.source_sha }}
      python_package_version:
        description: "Python package version embedded in the verified installer"
        value: ${{ jobs.signed-installed-proof.outputs.python_package_version }}
      desktop_version:
        description: "Electron version embedded in the verified installer"
        value: ${{ jobs.signed-installed-proof.outputs.desktop_version }}
  # `labeled` lets adding `ci:full` rerun the PR with every platform proof.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Each merge group has its own queue ref; a queue run is never cancelled. A
# nightly call gets a group of its own, so neither a release nor a manual
# dispatch on main cancels it, and it cancels neither.
concurrency:
  group: desktop-windows-${{ inputs.nightly && format('nightly-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && !inputs.nightly }}

env:
  # A dependency download slower than uv's 30-second default must not fail the job.
  UV_HTTP_TIMEOUT: "120"

jobs:
  # Decides whether this run builds and proves the unsigned installed app.
  #   * Pull requests and the merge queue: only when the diff changes the
  #     job's own inputs (listed beside the filter below). A change to the
  #     rest of what the app bundles is deferred to the nightly platform run
  #     on main, and the required check still passes, saying so.
  #   * `ci:full` pull requests and the nightly platform run: always.
  #   * Manual dispatches and release calls run the signed jobs instead.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.nightly
    runs-on: ubuntu-26.04
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
      reason: ${{ steps.paths.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          NIGHTLY: ${{ inputs.nightly || false }}
        run: |
          set -euo pipefail
          # Packaging: the dependency lock and Python pin, the build hook and
          # native extension sources, the web build script, this workflow.
          packaging='pyproject\.toml$|uv\.lock$|\.python-version$|hatch_build\.py$|scripts/build_vec1\.py$|vendor/sqlite-vec1/|scripts/release/build_frontend\.py$|\.github/workflows/desktop-windows\.yml$'
          # Platform-specific Python, the same in all four platform workflows:
          # the runtime supervisor, launcher and guardian, the process sandbox,
          # the native engine workers, the CLI and its signal handling, the
          # model-server environment, and the modules that branch on the OS
          # for process trees, file locking, reserved names and app paths.
          platform_code='src/frisket/(runtime|engine/sandbox|engine/_workers|cli|data/model-server)/|src/frisket/(engine/recipe_fence_posture|retrieval/native|operability/diagnostics|cloud_connection|project_identity|server/workspace|team/security/secrets|ops/ytdlp|ops/media_metadata|ops/integrations/mcp_stdio)\.py$'
          # A changed Python line anywhere under src/ that branches on the OS
          # or starts, signals or confines a process, the same in all four.
          platform_lines='sys\.platform|os\.name|platform\.(system|machine)\(|(import|from) +(fcntl|msvcrt|winreg|_winapi|termios|pwd|grp|resource)\b|creationflags|start_new_session|preexec_fn|os\.(kill|killpg|setsid|setpgrp|fork|getpgid)\(|signal\.(SIG|signal\()|subprocess\.(Popen|run|call|check_call|check_output)\(|create_subprocess_|multiprocessing|ctypes'
          # Own inputs: the desktop shell, the desktop server entry point,
          # the native Windows guardian test, platform-specific Python and
          # packaging.
          own="^(desktop/|src/frisket/server/desktop\.py$|tests/runtime/test_windows_guard\.py$|$platform_code|$packaging)"
          # Everything the installed app bundles or runs. A change here outside
          # the own inputs is proved by the nightly platform run on main.
          bundled="^(desktop/|src/frisket/|web/|sdk/|sidecar/|$packaging)"
          relevant=true
          if [ "${NIGHTLY:-false}" = true ]; then
            reason="the nightly platform run proves this revision in full"
          elif [ "${FULL_LABEL:-false}" = true ]; then
            reason="the \`ci:full\` label runs every platform proof"
          else
            if [ "$EVENT_NAME" = merge_group ]; then base="${QUEUE_BASE_SHA:-}"; else base="${BASE_SHA:-}"; fi
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              reason="the diff base is unavailable, so the installed app is proved"
            else
              files="$(git diff --name-only "$base" HEAD)"
              inventory="$(git diff --name-only --diff-filter=ADR "$base" HEAD)"
              patch="$(git diff -U0 "$base" HEAD -- 'src/*.py')"
              changed="$(grep -E '^[+-]([^+-]|$)' <<< "$patch" | grep -E "$platform_lines" || true)"
              if hit="$(grep -E "$own" <<< "$files")"; then
                reason="this diff changes an input of the installed app: ${hit%%$'\n'*}"
              # prepare.py refuses a wheel missing a resource it requires, so
              # adding, removing or renaming package data or a bundled plugin
              # file changes the packaging.
              elif hit="$(grep -E '^src/frisket/(data|authoring/bundled_plugins)/' <<< "$inventory")"; then
                reason="this diff adds, removes or renames a bundled resource: ${hit%%$'\n'*}"
              elif [ -n "$changed" ]; then
                line="${changed%%$'\n'*}"
                reason="this diff changes platform-specific Python: $(tr -d '\r`' <<< "${line:0:100}")"
              elif grep -E "$bundled" <<< "$files" >/dev/null; then
                relevant=false
                reason="deferred to the nightly platform run on main: this diff changes what the installed app bundles, but none of its own inputs"
                if [ "$EVENT_NAME" = pull_request ]; then
                  reason="$reason (add the \`ci:full\` label to run it here)"
                fi
              else
                relevant=false
                reason="not affected: this diff changes nothing the installed app bundles or runs"
              fi
            fi
          fi
          {
            echo "relevant=$relevant"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "### Windows installed app ($EVENT_NAME): $reason" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  installed-app:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Check architecture and capacity
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitOperatingSystem -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw 'Windows desktop beta requires an x64 runner.'
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      - name: Install build dependencies
        shell: pwsh
        run: |
          npm --prefix sdk ci
          npm --prefix sdk run build
          npm --prefix web ci
          npm --prefix desktop ci
      - name: Build Windows application resources
        run: python desktop/scripts/prepare.py --platform win32
      - name: Focused desktop unit checks
        run: npm --prefix desktop test
      - name: Native Windows guardian console proof
        env:
          PYTHONPATH: desktop/resources/python
          # Native guardian tests require only pytest's built-in fixtures.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # Exercise the built wheel with its exported, locked application dependencies.
        run: >-
          uv run --no-project --with-requirements desktop/resources/requirements.txt
          --with pytest==9.0.3 python -m pytest --confcutdir tests/runtime
          -o addopts= -q tests/runtime/test_windows_guard.py
      - name: Package unsigned Windows installer
        run: npm --prefix desktop run package:win
      - name: Install the NSIS artifact for this user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem desktop/dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          $installation = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "NSIS installer $($installers[0].Name) failed with exit code $($installation.ExitCode)."
          }
          # electron-builder uses package.name for the one-click per-user folder.
          $app = Join-Path $env:LOCALAPPDATA 'Programs\frisket-desktop\Frisket Desktop.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "NSIS installer did not create expected per-user executable: $app"
          }
          "FRISKET_DESKTOP_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRISKET_DESKTOP_PROFILE=$env:RUNNER_TEMP\frisket-desktop-profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRISKET_MODEL_RUNTIME_DIR=$env:RUNNER_TEMP\frisket-desktop-profile/model-runtimes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: First launch with an empty profile and cache (no Retry)
        run: node desktop/scripts/check-cold-start.mjs
      - name: Prepare download caches (networked setup)
        run: node desktop/scripts/prewarm.mjs --browser
      - name: Installed app and native engines (no new external connections)
        run: python desktop/scripts/test-installed.py
      - name: Upload unsigned beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-Desktop-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: desktop/dist/*.exe
      - name: Upload installed-app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-desktop-windows-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            desktop/playwright-report/
            desktop/test-results/
            desktop/resources/build.json
            desktop/resources/runtime.json

  signed-distribution:
    if: github.event_name == 'workflow_dispatch' && !inputs.nightly
    runs-on: windows-2022
    timeout-minutes: 75
    environment: desktop-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      publisher: ${{ steps.signing-metadata.outputs.publisher }}
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Check architecture and capacity
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitOperatingSystem -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw 'Windows desktop beta requires an x64 runner.'
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      - name: Check signing configuration
        id: signing-metadata
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          FRISKET_WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.FRISKET_WINDOWS_SIGNING_PUBLISHER_NAME }}
          FRISKET_WINDOWS_SIGNING_ENDPOINT: ${{ vars.FRISKET_WINDOWS_SIGNING_ENDPOINT }}
          FRISKET_WINDOWS_SIGNING_ACCOUNT: ${{ vars.FRISKET_WINDOWS_SIGNING_ACCOUNT }}
          FRISKET_WINDOWS_SIGNING_PROFILE: ${{ vars.FRISKET_WINDOWS_SIGNING_PROFILE }}
        run: |
          $names = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'FRISKET_WINDOWS_SIGNING_PUBLISHER_NAME', 'FRISKET_WINDOWS_SIGNING_ENDPOINT',
            'FRISKET_WINDOWS_SIGNING_ACCOUNT', 'FRISKET_WINDOWS_SIGNING_PROFILE')
          foreach ($name in $names) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or $value -match '[\r\n]') {
              throw "desktop-signing variable $name must contain one nonempty value."
            }
          }
          "publisher=$env:FRISKET_WINDOWS_SIGNING_PUBLISHER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "AZURE_CONFIG_DIR=$env:RUNNER_TEMP\frisket-azure-signing" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install build dependencies
        shell: pwsh
        run: |
          npm --prefix sdk ci
          npm --prefix sdk run build
          npm --prefix web ci
          npm --prefix desktop ci
      - name: Build Windows application resources
        run: python desktop/scripts/prepare.py --platform win32
      - name: Focused desktop unit checks
        run: npm --prefix desktop test
      - name: Native Windows guardian console proof
        env:
          PYTHONPATH: desktop/resources/python
          # Native guardian tests require only pytest's built-in fixtures.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # Exercise the built wheel with its exported, locked application dependencies.
        run: >-
          uv run --no-project --with-requirements desktop/resources/requirements.txt
          --with pytest==9.0.3 python -m pytest --confcutdir tests/runtime
          -o addopts= -q tests/runtime/test_windows_guard.py
      - name: Azure login with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Package signed Windows installer
        env:
          FRISKET_DESKTOP_WINDOWS_SIGNED_BUILD: '1'
          FRISKET_WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.FRISKET_WINDOWS_SIGNING_PUBLISHER_NAME }}
          FRISKET_WINDOWS_SIGNING_ENDPOINT: ${{ vars.FRISKET_WINDOWS_SIGNING_ENDPOINT }}
          FRISKET_WINDOWS_SIGNING_ACCOUNT: ${{ vars.FRISKET_WINDOWS_SIGNING_ACCOUNT }}
          FRISKET_WINDOWS_SIGNING_PROFILE: ${{ vars.FRISKET_WINDOWS_SIGNING_PROFILE }}
        shell: pwsh
        run: |
          npm --prefix desktop run package:win
          if ($LASTEXITCODE -ne 0) { throw 'Target Windows packaging failed.' }
          node desktop/scripts/package-update-baseline.mjs windows
          if ($LASTEXITCODE -ne 0) { throw 'Baseline Windows packaging failed.' }
      - name: Remove Azure login before transferring the artifact
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'frisket-azure-signing'
          if (Test-Path -LiteralPath $cache) {
            try {
              az logout
              if ($LASTEXITCODE -ne 0) { throw 'Azure logout failed.' }
              az account clear
              if ($LASTEXITCODE -ne 0) { throw 'Azure CLI account cleanup failed.' }
            } finally {
              Remove-Item -LiteralPath $cache -Recurse -Force
            }
          }
          if (Test-Path -LiteralPath $cache) { throw 'Azure login cache remains.' }
      - name: Verify signed installer and packaged application
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ steps.signing-metadata.outputs.publisher }}
        run: |
          $installers = @(Get-ChildItem desktop/dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          & desktop/scripts/verify-signature.ps1 -Paths @($installers[0].FullName, (Join-Path $PWD 'desktop/dist/win-unpacked/Frisket Desktop.exe')) -PublisherName $env:EXPECTED_PUBLISHER
      - name: Verify updater signature policy and prepare immutable metadata
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ steps.signing-metadata.outputs.publisher }}
        run: |
          $ErrorActionPreference = 'Stop'
          node desktop/scripts/stage-update.mjs prepare windows desktop/dist desktop/resources/build.json "$env:EXPECTED_PUBLISHER"
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater metadata validation failed.' }
          $baselines = @(Get-ChildItem desktop/update-baseline -Filter '*.exe' -File)
          if ($baselines.Count -ne 1) { throw 'Expected exactly one signed baseline installer.' }
          & desktop/scripts/verify-signature.ps1 -Paths @($baselines[0].FullName) -PublisherName $env:EXPECTED_PUBLISHER
      # This intermediate artifact is not a release. The fresh proof job below
      # has no OIDC permission and never receives an Azure login context.
      - name: Transfer signed candidate for installed proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-Desktop-windows-signed-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
            desktop/update-baseline/*.exe
            desktop/resources/build.json
            desktop/resources/runtime.json

  signed-installed-proof:
    if: github.event_name == 'workflow_dispatch' && !inputs.nightly
    needs: signed-distribution
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.release-metadata.outputs.source_sha }}
      python_package_version: ${{ steps.release-metadata.outputs.python_package_version }}
      desktop_version: ${{ steps.release-metadata.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Install desktop test dependencies
        run: npm --prefix desktop ci
      - name: Download this run's signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Frisket-Desktop-windows-signed-candidate-${{ github.sha }}
          path: desktop
      - name: Install and verify the signed NSIS artifact for this user
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ needs.signed-distribution.outputs.publisher }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem desktop/dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          & desktop/scripts/verify-signature.ps1 -Paths @($installers[0].FullName) -PublisherName $env:EXPECTED_PUBLISHER
          $build = Get-Content desktop/resources/build.json -Raw | ConvertFrom-Json
          if ($build.revision -ne $env:GITHUB_SHA) { throw 'Signed artifact revision does not match this dispatch.' }
          $installation = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "NSIS installer $($installers[0].Name) failed with exit code $($installation.ExitCode)."
          }
          # electron-builder uses package.name for the one-click per-user folder.
          $app = Join-Path $env:LOCALAPPDATA 'Programs\frisket-desktop\Frisket Desktop.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "NSIS installer did not create expected per-user executable: $app"
          }
          & desktop/scripts/verify-signature.ps1 -Paths @($app) -PublisherName $env:EXPECTED_PUBLISHER
          $installedBuild = Get-Content (Join-Path (Split-Path $app) 'resources/build.json') -Raw | ConvertFrom-Json
          if ($installedBuild.revision -ne $env:GITHUB_SHA) { throw 'Installed application revision does not match this dispatch.' }
          "FRISKET_DESKTOP_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRISKET_DESKTOP_PROFILE=$env:RUNNER_TEMP\frisket-desktop-profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRISKET_MODEL_RUNTIME_DIR=$env:RUNNER_TEMP\frisket-desktop-profile/model-runtimes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: First launch with an empty profile and cache (no Retry)
        run: node desktop/scripts/check-cold-start.mjs
      - name: Prepare download caches (networked setup)
        run: node desktop/scripts/prewarm.mjs --browser
      - name: Installed signed app and native engines (no new external connections)
        run: python desktop/scripts/test-installed.py
      - name: Verify installed application signature after use
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ needs.signed-distribution.outputs.publisher }}
        run: |
          & desktop/scripts/verify-signature.ps1 -Paths @($env:FRISKET_DESKTOP_APP) -PublisherName $env:EXPECTED_PUBLISHER
      - name: Install signed baseline and prove the actual update and restart
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ needs.signed-distribution.outputs.publisher }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baselines = @(Get-ChildItem desktop/update-baseline -Filter '*.exe' -File)
          if ($baselines.Count -ne 1) { throw 'Expected exactly one signed baseline installer.' }
          & desktop/scripts/verify-signature.ps1 -Paths @($baselines[0].FullName) -PublisherName $env:EXPECTED_PUBLISHER
          $installation = Start-Process -FilePath $baselines[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw 'Signed baseline installation failed.' }
          & desktop/scripts/verify-signature.ps1 -Paths @($env:FRISKET_DESKTOP_APP) -PublisherName $env:EXPECTED_PUBLISHER
          $env:FRISKET_DESKTOP_UPDATE_TARGET_DIST = Join-Path $PWD 'desktop/dist'
          $env:FRISKET_DESKTOP_UPDATE_TARGET_VERSION = (Get-Content desktop/resources/build.json -Raw | ConvertFrom-Json).version
          python desktop/scripts/test-installed.py --update
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows update proof failed.' }
          & desktop/scripts/verify-signature.ps1 -Paths @($env:FRISKET_DESKTOP_APP) -PublisherName $env:EXPECTED_PUBLISHER
          Remove-Item -LiteralPath desktop/update-baseline -Recurse -Force
      - name: Record proof-approved release metadata
        id: release-metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Get-Content desktop/resources/build.json -Raw | ConvertFrom-Json
          if ($build.revision -ne $env:GITHUB_SHA) {
            throw 'Verified installer revision does not match this dispatch.'
          }
          foreach ($name in @('pythonPackageVersion', 'version')) {
            $value = [string]$build.$name
            if ([string]::IsNullOrWhiteSpace($value) -or $value -match '[\r\n]') {
              throw "Verified installer has invalid $name metadata."
            }
          }
          if ([string]$build.version -notmatch '^\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') {
            throw 'Verified installer has an unsupported desktop version.'
          }
          "source_sha=$($build.revision)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "python_package_version=$($build.pythonPackageVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "desktop_version=$($build.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload signed beta after installed proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-Desktop-windows-x64-signed-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
      - name: Upload signed installed-app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-desktop-windows-signed-evidence-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            desktop/playwright-report/
            desktop/test-results/
            desktop/resources/build.json
            desktop/resources/runtime.json
            desktop/update-test-results/
            desktop/playwright-update-report/

  desktop-windows-ci:
    name: desktop-windows-ci
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.nightly) }}
    needs: [changes, installed-app]
    runs-on: ubuntu-26.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "### $GITHUB_JOB: ${REASON:-the change filter did not finish}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          jq -e '.changes.result == "success" and ([.[] .result] | all(. == "success" or . == "skipped"))' <<< "$RESULTS"
