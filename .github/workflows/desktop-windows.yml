name: desktop-windows

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/frisket/**'
      - 'web/**'
      - 'sdk/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-app:
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Check architecture and capacity
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitOperatingSystem -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw 'Windows desktop beta requires an x64 runner.'
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      - name: Install build dependencies
        shell: pwsh
        run: |
          npm --prefix sdk ci
          npm --prefix sdk run build
          npm --prefix web ci
          npm --prefix desktop ci
      - name: Build Windows application resources
        run: python desktop/scripts/prepare.py --platform win32
      - name: Focused desktop unit checks
        run: npm --prefix desktop test
      - name: Package unsigned Windows installer
        run: npm --prefix desktop run package:win
      - name: Install the NSIS artifact for this user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem desktop/dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Frisket Desktop\Frisket Desktop.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "NSIS installer did not create expected per-user executable: $app"
          }
          "FRISKET_DESKTOP_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRISKET_DESKTOP_PROFILE=$env:RUNNER_TEMP\frisket-desktop-profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare download caches (networked setup)
        run: node desktop/scripts/prewarm.mjs
      - name: Installed app and native engines (no new external connections)
        run: python desktop/scripts/test-installed.py
      - name: Upload unsigned beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-Desktop-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: desktop/dist/*.exe
      - name: Upload installed-app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-desktop-windows-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            desktop/playwright-report/
            desktop/test-results/
            desktop/resources/build.json
            desktop/resources/runtime.json
