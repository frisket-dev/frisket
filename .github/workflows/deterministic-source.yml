name: deterministic-source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: deterministic-source
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate rolling pricing PR
        if: github.event_name == 'pull_request' && github.head_ref == 'pricing-refresh'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pricing_path="src/frisket/ai/llm/pricing_data.json"
          if [ "$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")" != "$pricing_path" ]; then
            echo "Rolling pricing PRs may change only pricing_data.json" >&2
            exit 1
          fi
          git show "${BASE_SHA}:${pricing_path}" > "$RUNNER_TEMP/pricing-before.json"
          git show "${HEAD_SHA}:${pricing_path}" > "$RUNNER_TEMP/pricing-after.json"
          python3 scripts/dev/update_pricing.py --validate \
            "$RUNNER_TEMP/pricing-before.json" "$RUNNER_TEMP/pricing-after.json"
      - name: Compile Python sources
        run: python -m compileall -q src scripts/ci tests
      - name: Run deterministic source checks
        run: |
          set -euo pipefail
          for check in scripts/ci/lint_*.py; do
            python "$check"
          done
          python scripts/ci/check_import_boundaries.py \
            --source-root src \
            --config scripts/ci/import_boundaries.json
