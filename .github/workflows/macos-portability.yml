name: macos-portability

on:
  # The nightly platform run calls this workflow on the head of main.
  workflow_call:
  # `labeled` lets adding `ci:full` rerun the PR with every platform proof.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer PR event supersedes the in-flight PR run. Every other run gets its
# own group, so no queue, push or nightly run is cancelled or held pending
# here. The name is literal: in a called workflow `github.workflow` is the
# caller's, which would put both portability calls in one group.
concurrency:
  group: macos-portability-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A dependency download slower than uv's 30-second default must not fail the job.
  UV_HTTP_TIMEOUT: "120"

jobs:
  queue-tested:
    permissions:
      actions: read
    uses: ./.github/workflows/queue-tested.yml
    with:
      workflow: macos-portability.yml
      job: macos-portability

  # Decides whether this run needs the macOS smoke.
  #   * Pull requests and the merge queue: only when the diff changes the
  #     smoke's own inputs (listed beside the filter below). A change to the
  #     rest of what the smoke imports or runs is deferred to the nightly
  #     platform run on main, and the required check still passes, saying so.
  #   * `ci:full` pull requests, manual dispatches and the nightly platform
  #     run: always.
  #   * Pushes to main: always, unless the merge queue already ran this exact
  #     commit (whose queue run then stands for it).
  #   * The non-required managed-python job runs whenever the Python package,
  #     the tests or the dependency lock change, on pull requests and in the
  #     queue alike.
  changes:
    needs: queue-tested
    # A failed queue lookup still decides, and the push then runs the smoke.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
      managed_python: ${{ steps.paths.outputs.managed_python }}
      reason: ${{ steps.paths.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          QUEUE_TESTED: ${{ needs.queue-tested.outputs.tested }}
        run: |
          set -euo pipefail
          # Packaging: the dependency lock and Python pin, the build hook and
          # native extension sources, this workflow.
          packaging='pyproject\.toml$|uv\.lock$|\.python-version$|hatch_build\.py$|scripts/build_vec1\.py$|vendor/sqlite-vec1/|\.github/workflows/macos-portability\.yml$'
          # Platform-specific Python, the same in all four platform workflows:
          # the runtime supervisor, launcher and guardian, the process sandbox,
          # the native engine workers, the CLI and its signal handling, the
          # model-server environment, and the modules that branch on the OS
          # for process trees, file locking, reserved names and app paths.
          platform_code='src/frisket/(runtime|engine/sandbox|engine/_workers|cli|data/model-server)/|src/frisket/(engine/recipe_fence_posture|retrieval/native|operability/diagnostics|cloud_connection|project_identity|server/workspace|team/security/secrets|ops/ytdlp|ops/media_metadata|ops/integrations/mcp_stdio)\.py$'
          # A changed Python line anywhere under src/ that branches on the OS
          # or starts, signals or confines a process, the same in all four.
          platform_lines='sys\.platform|os\.name|platform\.(system|machine)\(|(import|from) +(fcntl|msvcrt|winreg|_winapi|termios|pwd|grp|resource)\b|creationflags|start_new_session|preexec_fn|os\.(kill|killpg|setsid|setpgrp|fork|getpgid)\(|signal\.(SIG|signal\()|subprocess\.(Popen|run|call|check_call|check_output)\(|create_subprocess_|multiprocessing|ctypes'
          # Own inputs: platform-specific Python and packaging, the tests this
          # smoke runs, and the modules they prove on macOS (store leases, blob
          # paths, bulk import).
          own="^(tests/runtime/|tests/test_cli_main\.py$|tests/engine/test_(blob_path_ingest|import_csv_executor|import_csv_typed_boundaries|store_leases)\.py$|tests/server/test_server_import_bulk_|tests/ai/test_store\.py$|src/frisket/engine/store/(leases|blob_backend|media_blobs)\.py$|src/frisket/server/services/import_bulk|conftest\.py$|tests/conftest\.py$|$platform_code|$packaging)"
          # Everything the smoke imports, installs or runs. A change here
          # outside the own inputs is proved by the nightly platform run.
          imported="^(src/|tests/|sidecar/|conftest\.py$|$packaging)"
          # The managed-python job: the Python package, the tests and their
          # configuration, the lock and Python pin, the vec1 build, this workflow.
          managed_inputs='^(src/frisket/|tests/|conftest\.py$|pyproject\.toml$|uv\.lock$|\.python-version$|hatch_build\.py$|scripts/build_vec1\.py$|vendor/sqlite-vec1/|\.github/workflows/macos-portability\.yml$)'
          relevant=true
          managed_python=true
          if [ "$EVENT_NAME" = push ] && [ "${QUEUE_TESTED:-}" = true ]; then
            relevant=false
            managed_python=false
            reason="this commit passed macos-portability in the merge queue, which stands for this push"
          elif [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != merge_group ]; then
            reason="this $EVENT_NAME run proves the revision in full"
          elif [ "${FULL_LABEL:-false}" = true ]; then
            reason="the \`ci:full\` label runs every platform proof"
          else
            if [ "$EVENT_NAME" = merge_group ]; then base="${QUEUE_BASE_SHA:-}"; else base="${BASE_SHA:-}"; fi
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              reason="the diff base is unavailable, so the smoke runs"
            else
              files="$(git diff --name-only "$base" HEAD)"
              patch="$(git diff -U0 "$base" HEAD -- 'src/*.py')"
              changed="$(grep -E '^[+-]([^+-]|$)' <<< "$patch" | grep -E "$platform_lines" || true)"
              if ! grep -E "$managed_inputs" <<< "$files" >/dev/null; then managed_python=false; fi
              if hit="$(grep -E "$own" <<< "$files")"; then
                reason="this diff changes an input of the smoke: ${hit%%$'\n'*}"
              elif [ -n "$changed" ]; then
                line="${changed%%$'\n'*}"
                reason="this diff changes platform-specific Python: $(tr -d '\r`' <<< "${line:0:100}")"
              elif grep -E "$imported" <<< "$files" >/dev/null; then
                relevant=false
                reason="deferred to the nightly platform run on main: this diff changes what the smoke imports or runs, but none of its own inputs"
                if [ "$EVENT_NAME" = pull_request ]; then
                  reason="$reason (add the \`ci:full\` label to run it here)"
                fi
              else
                relevant=false
                reason="not affected: this diff changes nothing the smoke imports or runs"
              fi
            fi
          fi
          {
            echo "relevant=$relevant"
            echo "managed_python=$managed_python"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "### macos-portability ($EVENT_NAME): $reason" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  smoke:
    name: macos-portability smoke
    needs: changes
    # A failed `changes` job skips it and fails the required check below.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.relevant == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      FRISKET_NO_WORKER: "1"
      FRISKET_SECRETS_MASTER_KEY: "macos-portability-test-key-not-for-production"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --dev --locked
      - name: Import package and server graph
        run: >-
          uv run --no-sync python -c "import frisket; import frisket.cli; import frisket.engine.jobs.queue; import frisket.engine.sandbox; import frisket.server.app; import frisket.server.services.projects; import frisket.server.workspace"
      - name: Run deployment self-probe
        run: uv run --no-sync frisket doctor
      - name: Run local startup, import, blob, and locking contracts
        run: >-
          uv run --no-sync pytest -q tests/test_cli_main.py tests/runtime/test_model_server.py tests/runtime/test_model_install.py tests/runtime/test_model_recovery.py tests/runtime/test_environment_use.py tests/engine/test_blob_path_ingest.py tests/engine/test_import_csv_executor.py tests/engine/test_import_csv_typed_boundaries.py tests/server/test_server_import_bulk_routes.py tests/server/test_server_import_bulk_extensionless_email.py tests/server/test_server_import_bulk_email_parity.py tests/ai/test_store.py::TestBasics::test_create_open_roundtrip tests/ai/test_store.py::TestConcurrentOpen::test_a_knob_change_mints_one_successor_not_one_per_open tests/engine/test_store_leases.py

  managed-python:
    # Developer venvs run on uv-managed CPython, whose SQLite is built without
    # SQLITE_USE_URI; the setup-python build above (and ubuntu's system Python
    # in ci.yml) has it on. Code that ATTACHes a `file:` URI through a
    # connection opened without uri=True passes there and fails here.
    name: macos-managed-python
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.managed_python == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      FRISKET_NO_WORKER: "1"
      FRISKET_SECRETS_MASTER_KEY: "macos-portability-test-key-not-for-production"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --dev --locked
      - name: Require the uv-managed interpreter and its SQLite build
        run: |
          set -euo pipefail
          managed="$(uv python dir)"
          base="$(uv run --no-sync python -c 'import sys; print(sys.base_prefix)')"
          uv run --no-sync python -c 'import sqlite3; print("sqlite", sqlite3.sqlite_version, [o for o in sqlite3.connect(":memory:").execute("pragma compile_options").fetchall() if "URI" in o[0]])'
          case "$base" in
            "$managed"/*) echo "uv-managed interpreter: $base" ;;
            *) echo "interpreter $base is not under uv's managed dir $managed"; exit 1 ;;
          esac
      - run: uv run --no-sync python scripts/build_vec1.py
      - name: Run snapshot, retrieval and embedding-view tests
        run: >-
          uv run --no-sync pytest -q -n auto --dist loadfile
          tests/engine/test_project_read_snapshot_uri_attach.py
          tests/ai/test_embedding_lens.py
          tests/ai/test_embedding_similarity_queryspec.py
          tests/features/test_composed_view_selection.py
          tests/retrieval

  # The required check. It fails unless `changes` succeeded and the smoke
  # passed or was deliberately skipped; its summary says why it skipped.
  macos-portability:
    name: macos-portability
    if: ${{ always() }}
    needs: [changes, smoke]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "### $GITHUB_JOB: ${REASON:-the change filter did not finish}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          jq -e '.changes.result == "success" and ([.[] .result] | all(. == "success" or . == "skipped"))' <<< "$RESULTS"
