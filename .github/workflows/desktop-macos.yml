name: desktop-macos

on:
  workflow_call:
    inputs:
      nightly:
        description: "Prove the unsigned installed app on this revision regardless of the diff (the nightly platform run)"
        required: false
        default: false
        type: boolean
    # Optional here so protected environment secrets can supply these values.
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
    outputs:
      source_sha:
        description: "Revision verified by the signed installed-app proof"
        value: ${{ jobs.signed-distribution.outputs.source_sha }}
      python_package_version:
        description: "Python package version embedded in the verified installer"
        value: ${{ jobs.signed-distribution.outputs.python_package_version }}
      desktop_version:
        description: "Electron version embedded in the verified installer"
        value: ${{ jobs.signed-distribution.outputs.desktop_version }}
  # `labeled` lets adding `ci:full` rerun the PR with every platform proof.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      notary_status_only:
        description: 'Inspect recent Frisket notarization submissions only'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Each merge group has its own queue ref; a queue run is never cancelled. A
# nightly call gets a group of its own, so neither a release nor a manual
# dispatch on main cancels it, and it cancels neither.
concurrency:
  group: desktop-macos-${{ inputs.nightly && format('nightly-{0}', github.run_id) || github.event.pull_request.number || github.ref }}-${{ inputs.notary_status_only || false }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && !inputs.nightly }}

env:
  # A dependency download slower than uv's 30-second default must not fail the job.
  UV_HTTP_TIMEOUT: "120"

jobs:
  # Decides whether this run builds and proves the unsigned installed app.
  #   * Pull requests and the merge queue: only when the diff changes the
  #     job's own inputs (listed beside the filter below). A change to the
  #     rest of what the app bundles is deferred to the nightly platform run
  #     on main, and the required check still passes, saying so.
  #   * `ci:full` pull requests and the nightly platform run: always.
  #   * Manual dispatches and release calls run the signed jobs instead.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.nightly
    runs-on: ubuntu-26.04
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
      reason: ${{ steps.paths.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          NIGHTLY: ${{ inputs.nightly || false }}
        run: |
          set -euo pipefail
          # Packaging: the dependency lock and Python pin, the build hook and
          # native extension sources, the web build script, this workflow.
          packaging='pyproject\.toml$|uv\.lock$|\.python-version$|hatch_build\.py$|scripts/build_vec1\.py$|vendor/sqlite-vec1/|scripts/release/build_frontend\.py$|\.github/workflows/desktop-macos\.yml$'
          # Platform-specific Python, the same in all four platform workflows:
          # the runtime supervisor, launcher and guardian, the process sandbox,
          # the native engine workers, the CLI and its signal handling, the
          # model-server environment, and the modules that branch on the OS
          # for process trees, file locking, reserved names and app paths.
          platform_code='src/frisket/(runtime|engine/sandbox|engine/_workers|cli|data/model-server)/|src/frisket/(engine/recipe_fence_posture|retrieval/native|operability/diagnostics|cloud_connection|project_identity|server/workspace|security/secrets|ops/ytdlp|ops/media_metadata|ops/integrations/mcp_stdio)\.py$'
          # A changed Python line anywhere under src/ that branches on the OS
          # or starts, signals or confines a process, the same in all four.
          platform_lines='sys\.platform|os\.name|platform\.(system|machine)\(|(import|from) +(fcntl|msvcrt|winreg|_winapi|termios|pwd|grp|resource)\b|creationflags|start_new_session|preexec_fn|os\.(kill|killpg|setsid|setpgrp|fork|getpgid)\(|signal\.(SIG|signal\()|subprocess\.(Popen|run|call|check_call|check_output)\(|create_subprocess_|multiprocessing|ctypes'
          # Own inputs: the desktop shell, the desktop server entry point,
          # platform-specific Python and packaging.
          own="^(desktop/|src/frisket/server/desktop\.py$|$platform_code|$packaging)"
          # Everything the installed app bundles or runs. A change here outside
          # the own inputs is proved by the nightly platform run on main.
          bundled="^(desktop/|src/frisket/|web/|sdk/|sidecar/|$packaging)"
          relevant=true
          if [ "${NIGHTLY:-false}" = true ]; then
            reason="the nightly platform run proves this revision in full"
          elif [ "${FULL_LABEL:-false}" = true ]; then
            reason="the \`ci:full\` label runs every platform proof"
          else
            if [ "$EVENT_NAME" = merge_group ]; then base="${QUEUE_BASE_SHA:-}"; else base="${BASE_SHA:-}"; fi
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              reason="the diff base is unavailable, so the installed app is proved"
            else
              files="$(git diff --name-only "$base" HEAD)"
              inventory="$(git diff --name-only --diff-filter=ADR "$base" HEAD)"
              patch="$(git diff -U0 "$base" HEAD -- 'src/*.py')"
              changed="$(grep -E '^[+-]([^+-]|$)' <<< "$patch" | grep -E "$platform_lines" || true)"
              if hit="$(grep -E "$own" <<< "$files")"; then
                reason="this diff changes an input of the installed app: ${hit%%$'\n'*}"
              # prepare.py refuses a wheel missing a resource it requires, so
              # adding, removing or renaming package data or a bundled plugin
              # file changes the packaging.
              elif hit="$(grep -E '^src/frisket/(data|authoring/bundled_plugins)/' <<< "$inventory")"; then
                reason="this diff adds, removes or renames a bundled resource: ${hit%%$'\n'*}"
              elif [ -n "$changed" ]; then
                line="${changed%%$'\n'*}"
                reason="this diff changes platform-specific Python: $(tr -d '\r`' <<< "${line:0:100}")"
              elif grep -E "$bundled" <<< "$files" >/dev/null; then
                relevant=false
                reason="deferred to the nightly platform run on main: this diff changes what the installed app bundles, but none of its own inputs"
                if [ "$EVENT_NAME" = pull_request ]; then
                  reason="$reason (add the \`ci:full\` label to run it here)"
                fi
              else
                relevant=false
                reason="not affected: this diff changes nothing the installed app bundles or runs"
              fi
            fi
          fi
          {
            echo "relevant=$relevant"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "### macOS installed app ($EVENT_NAME): $reason" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  startup-window:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm --prefix desktop ci
      - name: Check native startup sizing without building the application
        # Native resize timing on a hosted runner fails this intermittently, so
        # it gets one more attempt.
        run: node --test desktop/tests/startup-size.test.mjs || node --test desktop/tests/startup-size.test.mjs

  notary-status:
    if: github.event_name == 'workflow_dispatch' && inputs.notary_status_only == true
    runs-on: macos-15
    timeout-minutes: 5
    environment: desktop-signing
    steps:
      - name: Inspect recent Frisket notarization submissions
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for the notarization diagnostic."
              exit 1
            fi
          done
          umask 077
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          cleanup() {
            local status=$?
            rm -f "$api_key" || true
            unset APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key"
          test -s "$api_key"
          NOTARY_API_KEY="$api_key" python3 - <<'PY'
          import json, os, subprocess

          command = [
              "xcrun", "notarytool", "history",
              "--key", os.environ["NOTARY_API_KEY"],
              "--key-id", os.environ["APPLE_API_KEY_ID"],
              "--issuer", os.environ["APPLE_API_ISSUER"],
              "--output-format", "json",
          ]
          try:
              result = subprocess.run(command, check=True, stdout=subprocess.PIPE,
                                      stderr=subprocess.DEVNULL, text=True, timeout=60)
              history = json.loads(result.stdout)["history"]
              if not isinstance(history, list):
                  raise ValueError
          except (subprocess.SubprocessError, KeyError, TypeError, ValueError):
              raise SystemExit("::error::notarytool history failed or returned invalid JSON") from None
          matches = [row for row in history if isinstance(row, dict)
                     and isinstance(row.get("name"), str)
                     and "frisket" in row["name"].casefold()]
          matches.sort(key=lambda row: str(row.get("createdDate") or ""), reverse=True)
          print(f"matchingSubmissionCount={len(matches)}")
          for row in matches[:12]:
              text = lambda key: row.get(key) if isinstance(row.get(key), str) else None
              print(json.dumps({"submissionId": text("id"), "status": text("status"),
                                "createdDate": text("createdDate"), "name": row["name"]}))
          PY

  installed-app:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-15
    # A healthy run takes 6-11 minutes; the per-step bounds below stop a hung
    # launch or proof early enough for the evidence upload to still run.
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # This job has no signing secrets; explicitly permit the ad-hoc PR build.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Check architecture and capacity
        run: |
          echo "FRISKET_DESKTOP_APP=$RUNNER_TEMP/Applications/Frisket Desktop.app" >> "$GITHUB_ENV"
          echo "FRISKET_DESKTOP_PROFILE=$RUNNER_TEMP/frisket-desktop-profile" >> "$GITHUB_ENV"
          echo "FRISKET_MODEL_RUNTIME_DIR=$RUNNER_TEMP/frisket-desktop-profile/model-runtimes" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          df -h .
      - name: Install build dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix sdk run build
          npm --prefix web ci
          npm --prefix desktop ci
      - name: Build application resources
        run: python3 desktop/scripts/prepare.py
      - name: Focused desktop unit checks
        # Same files as `npm --prefix desktop test`. Only the startup sizing
        # file, which fails intermittently on native resize timing, gets one
        # more attempt; every other file must pass the first time.
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          sizing=tests/startup-size.test.mjs
          test -f "$sizing"
          node --test $(ls tests/*.test.mjs | grep -vxF "$sizing")
          node --test "$sizing" || node --test "$sizing"
      - name: Package DMG
        run: npm --prefix desktop run package:mac
      - name: Install from the DMG
        shell: bash
        run: |
          set -euo pipefail
          image=(desktop/dist/*.dmg)
          test "${#image[@]}" -eq 1
          mount_path="$RUNNER_TEMP/frisket-dmg"
          mkdir -p "$mount_path" "$(dirname "$FRISKET_DESKTOP_APP")"
          hdiutil attach "${image[0]}" -readonly -nobrowse -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path"' EXIT
          ditto "$mount_path/Frisket Desktop.app" "$FRISKET_DESKTOP_APP"
          codesign --verify --deep --strict "$FRISKET_DESKTOP_APP"
      - name: First launch with an empty profile and cache (no Retry)
        # Two bounded launch attempts plus the script's 15-minute startup wait.
        timeout-minutes: 20
        run: node desktop/scripts/check-cold-start.mjs
      - name: Prepare download caches (networked setup)
        # The artifact hosts return occasional server errors, so the setup gets
        # one more attempt; the bound covers both.
        timeout-minutes: 10
        run: node desktop/scripts/prewarm.mjs --browser || node desktop/scripts/prewarm.mjs --browser
      - name: Installed app and native engines (no new external connections)
        timeout-minutes: 15
        run: python3 desktop/scripts/test-installed.py
      - name: Verify installed app signature after use
        run: codesign --verify --deep --strict --verbose=4 "$FRISKET_DESKTOP_APP"
      - name: Upload beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-Desktop-macos-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: desktop/dist/*.dmg
      - name: Upload installed-app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-desktop-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            desktop/playwright-report/
            desktop/test-results/
            desktop/resources/build.json
            desktop/resources/runtime.json

  signed-distribution:
    if: github.event_name == 'workflow_dispatch' && inputs.notary_status_only != true && !inputs.nightly
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    environment: desktop-signing
    outputs:
      source_sha: ${{ steps.release-metadata.outputs.source_sha }}
      python_package_version: ${{ steps.release-metadata.outputs.python_package_version }}
      desktop_version: ${{ steps.release-metadata.outputs.desktop_version }}
    steps:
      - name: Check signing configuration
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for macOS signing."
              exit 1
            fi
          done
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Check architecture and capacity
        run: |
          echo "FRISKET_DESKTOP_APP=$RUNNER_TEMP/Applications/Frisket Desktop.app" >> "$GITHUB_ENV"
          echo "FRISKET_DESKTOP_PROFILE=$RUNNER_TEMP/frisket-desktop-profile" >> "$GITHUB_ENV"
          echo "FRISKET_MODEL_RUNTIME_DIR=$RUNNER_TEMP/frisket-desktop-profile/model-runtimes" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          df -h .
      - name: Install build dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix sdk run build
          npm --prefix web ci
          npm --prefix desktop ci
      - name: Build application resources
        run: python3 desktop/scripts/prepare.py
      - name: Focused desktop unit checks
        run: npm --prefix desktop test
      - name: Sign, notarize, and verify distribution
        shell: bash
        env:
          # The PR job disables discovery; allow the CSC_LINK-imported Developer ID identity here.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          mount_point=''
          cleanup() {
            local status=$?
            if [[ -n "$mount_point" ]]; then
              hdiutil detach "$mount_point" -quiet || true
              rmdir "$mount_point" || true
            fi
            rm -f "$api_key" || true
            unset APPLE_API_KEY APPLE_API_KEY_P8 CSC_LINK CSC_KEY_PASSWORD
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key"
          test -s "$api_key"
          export FRISKET_DESKTOP_SIGNED_BUILD=1
          export APPLE_API_KEY="$api_key"
          npm --prefix desktop run package:mac
          node desktop/scripts/package-update-baseline.mjs mac
          unset APPLE_API_KEY_P8 CSC_LINK CSC_KEY_PASSWORD
          image=(desktop/dist/*.dmg)
          app=(desktop/dist/mac-arm64/*.app)
          test "${#image[@]}" -eq 1
          test "${#app[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          codesign -dv --verbose=4 "${app[0]}" 2>&1 | grep -F 'Authority=Developer ID Application'
          node desktop/scripts/notarize-dmg.mjs "${image[0]}"
          xcrun stapler validate "${image[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${image[0]}"
          mount_point="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "${image[0]}"
          mounted_app=("$mount_point"/*.app)
          test "${#mounted_app[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${mounted_app[0]}"
          xcrun stapler validate "${mounted_app[0]}"
          spctl --assess --type execute --verbose=4 "${mounted_app[0]}"
          mkdir -p "$(dirname "$FRISKET_DESKTOP_APP")"
          ditto "${mounted_app[0]}" "$FRISKET_DESKTOP_APP"
          codesign --verify --deep --strict --verbose=2 "$FRISKET_DESKTOP_APP"
          hdiutil detach "$mount_point" -quiet
          rmdir "$mount_point"
          mount_point=''
      - name: Verify signed updater ZIP and prepare immutable metadata
        shell: bash
        run: |
          set -euo pipefail
          archives=(desktop/dist/*.zip)
          test "${#archives[@]}" -eq 1
          extracted="$RUNNER_TEMP/frisket-update-zip"
          ditto -x -k "${archives[0]}" "$extracted"
          codesign --verify --deep --strict --verbose=4 "$extracted/Frisket Desktop.app"
          xcrun stapler validate "$extracted/Frisket Desktop.app"
          spctl --assess --type execute --verbose=4 "$extracted/Frisket Desktop.app"
          rm -rf "$extracted"
          node desktop/scripts/stage-update.mjs prepare mac desktop/dist desktop/resources/build.json
      - name: First launch with an empty profile and cache (no Retry)
        run: node desktop/scripts/check-cold-start.mjs
      - name: Prepare download caches (networked setup)
        run: node desktop/scripts/prewarm.mjs --browser
      - name: Installed signed app and native engines (no new external connections)
        run: python3 desktop/scripts/test-installed.py
      - name: Verify installed app signature after use
        run: codesign --verify --deep --strict --verbose=4 "$FRISKET_DESKTOP_APP"
      - name: Install signed baseline and prove the actual update and restart
        shell: bash
        run: |
          set -euo pipefail
          baseline="desktop/update-baseline/mac-arm64/Frisket Desktop.app"
          codesign --verify --deep --strict --verbose=4 "$baseline"
          xcrun stapler validate "$baseline"
          rm -rf "$FRISKET_DESKTOP_APP"
          ditto "$baseline" "$FRISKET_DESKTOP_APP"
          export FRISKET_DESKTOP_UPDATE_TARGET_DIST="$PWD/desktop/dist"
          export FRISKET_DESKTOP_UPDATE_TARGET_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("desktop/resources/build.json")).version')"
          python3 desktop/scripts/test-installed.py --update
          codesign --verify --deep --strict --verbose=4 "$FRISKET_DESKTOP_APP"
          xcrun stapler validate "$FRISKET_DESKTOP_APP"
          rm -rf desktop/update-baseline
      - name: Record proof-approved release metadata
        id: release-metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" "$GITHUB_SHA" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          output, expected_sha = map(str, sys.argv[1:])
          build = json.loads(Path("desktop/resources/build.json").read_text())
          source_sha = build.get("revision")
          python_package_version = build.get("pythonPackageVersion")
          desktop_version = build.get("version")
          if source_sha != expected_sha:
              raise SystemExit("verified installer revision does not match this dispatch")
          if not all(isinstance(value, str) and value and "\n" not in value and "\r" not in value
                     for value in (python_package_version, desktop_version)):
              raise SystemExit("verified installer has invalid version metadata")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta|rc)\.[0-9]+)?", desktop_version):
              raise SystemExit("verified installer has an unsupported desktop version")
          with Path(output).open("a") as stream:
              stream.write(f"source_sha={source_sha}\n")
              stream.write(f"python_package_version={python_package_version}\n")
              stream.write(f"desktop_version={desktop_version}\n")
          PY
      - name: Upload signed beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-Desktop-macos-arm64-signed-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.zip.blockmap
            desktop/dist/latest-mac.yml
      - name: Upload signed installed-app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-desktop-signed-evidence-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            desktop/playwright-report/
            desktop/test-results/
            desktop/resources/build.json
            desktop/resources/runtime.json
            desktop/update-test-results/
            desktop/playwright-update-report/

  desktop-macos-ci:
    name: desktop-macos-ci
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.nightly) }}
    needs: [changes, installed-app, startup-window]
    runs-on: ubuntu-26.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "### $GITHUB_JOB: ${REASON:-the change filter did not finish}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          jq -e '.changes.result == "success" and ([.[] .result] | all(. == "success" or . == "skipped"))' <<< "$RESULTS"
