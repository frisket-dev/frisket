name: desktop-macos

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/frisket/**'
      - 'web/**'
      - 'sdk/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-app:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # This job has no signing secrets; explicitly permit the ad-hoc PR build.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Check architecture and capacity
        run: |
          echo "FRISKET_DESKTOP_APP=$RUNNER_TEMP/Applications/Frisket.app" >> "$GITHUB_ENV"
          echo "FRISKET_DESKTOP_PROFILE=$RUNNER_TEMP/frisket-desktop-profile" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          df -h .
      - name: Install build dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix sdk run build
          npm --prefix web ci
          npm --prefix desktop ci
      - name: Build application resources
        run: python3 desktop/scripts/prepare.py
      - name: Focused desktop unit checks
        run: npm --prefix desktop test
      - name: Package DMG and ZIP
        run: npm --prefix desktop run package:mac
      - name: Install from the DMG
        shell: bash
        run: |
          set -euo pipefail
          image=(desktop/dist/*.dmg)
          test "${#image[@]}" -eq 1
          mount_path="$RUNNER_TEMP/frisket-dmg"
          mkdir -p "$mount_path" "$(dirname "$FRISKET_DESKTOP_APP")"
          hdiutil attach "${image[0]}" -readonly -nobrowse -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path"' EXIT
          ditto "$mount_path/Frisket.app" "$FRISKET_DESKTOP_APP"
          codesign --verify --deep --strict "$FRISKET_DESKTOP_APP"
      - name: Prepare download caches (networked setup)
        run: node desktop/scripts/prewarm.mjs
      - name: Installed app and native engines (no new external connections)
        run: python3 desktop/scripts/test-installed.py
      - name: Upload beta
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-macos-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/resources/build.json
            desktop/resources/runtime.json
      - name: Upload installed-app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Frisket-desktop-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            desktop/playwright-report/
            desktop/test-results/
