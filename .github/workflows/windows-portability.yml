name: windows-portability

on:
  # The nightly platform run calls this workflow on the head of main.
  workflow_call:
  # `labeled` lets adding `ci:full` rerun the PR with every platform proof.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer PR event supersedes the in-flight PR run. Every other run gets its
# own group, so no queue, push or nightly run is cancelled or held pending
# here. The name is literal: in a called workflow `github.workflow` is the
# caller's, which would put both portability calls in one group.
concurrency:
  group: windows-portability-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A dependency download slower than uv's 30-second default must not fail the job.
  UV_HTTP_TIMEOUT: "120"

jobs:
  queue-tested:
    permissions:
      actions: read
    uses: ./.github/workflows/queue-tested.yml
    with:
      workflow: windows-portability.yml
      job: windows-portability

  # Decides whether this run needs the Windows smoke.
  #   * Pull requests and the merge queue: only when the diff changes the
  #     smoke's own inputs (listed beside the filter below). A change to the
  #     rest of what the smoke imports or runs is deferred to the nightly
  #     platform run on main, and the required check still passes, saying so.
  #   * `ci:full` pull requests, manual dispatches and the nightly platform
  #     run: always.
  #   * Pushes to main: always, unless the merge queue already ran this exact
  #     commit (whose queue run then stands for it).
  changes:
    needs: queue-tested
    # A failed queue lookup still decides, and the push then runs the smoke.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
      reason: ${{ steps.paths.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          QUEUE_TESTED: ${{ needs.queue-tested.outputs.tested }}
        run: |
          set -euo pipefail
          # Packaging: the dependency lock and Python pin, the build hook and
          # native extension sources, this workflow.
          packaging='pyproject\.toml$|uv\.lock$|\.python-version$|hatch_build\.py$|scripts/build_vec1\.py$|vendor/sqlite-vec1/|\.github/workflows/windows-portability\.yml$'
          # Platform-specific Python, the same in all four platform workflows:
          # the runtime supervisor, launcher and guardian, the process sandbox,
          # the native engine workers, the CLI and its signal handling, the
          # model-server environment, and the modules that branch on the OS
          # for process trees, file locking, reserved names and app paths.
          platform_code='src/frisket/(runtime|engine/sandbox|engine/_workers|cli|data/model-server)/|src/frisket/(engine/recipe_fence_posture|retrieval/native|operability/diagnostics|cloud_connection|project_identity|server/workspace|team/security/secrets|ops/ytdlp|ops/media_metadata|ops/integrations/mcp_stdio)\.py$'
          # A changed Python line anywhere under src/ that branches on the OS
          # or starts, signals or confines a process, the same in all four.
          platform_lines='sys\.platform|os\.name|platform\.(system|machine)\(|(import|from) +(fcntl|msvcrt|winreg|_winapi|termios|pwd|grp|resource)\b|creationflags|start_new_session|preexec_fn|os\.(kill|killpg|setsid|setpgrp|fork|getpgid)\(|signal\.(SIG|signal\()|subprocess\.(Popen|run|call|check_call|check_output)\(|create_subprocess_|multiprocessing|ctypes'
          # Own inputs: platform-specific Python and packaging, the tests this
          # smoke runs, and the modules they prove on Windows (store leases,
          # blob paths, bulk import, the job queue and worker, project
          # lifecycle, the recipe registry and team bootstrap file locking).
          own="^(tests/runtime/|tests/test_cli_main\.py$|tests/engine/test_(blob_path_ingest|import_csv_executor|import_csv_typed_boundaries|store_leases|job_queue|queue_memory_engines|rapidocr_worker|rapidocr_session|server|sandbox[a-z_]*)\.py$|tests/server/test_(server_import_bulk_|action_registry_store\.py$|server_project_lifecycle_routes\.py$)|tests/team/test_(byo_keys|team_entrypoint_hardening)\.py$|tests/ai/test_store\.py$|src/frisket/engine/store/(leases|blob_backend|media_blobs)\.py$|src/frisket/server/services/(import_bulk|projects\.py$)|src/frisket/engine/jobs/(queue|worker)|src/frisket/authoring/action_registry\.py$|src/frisket/team/team_bootstrap\.py$|conftest\.py$|tests/conftest\.py$|$platform_code|$packaging)"
          # Everything the smoke imports, installs or runs. A change here
          # outside the own inputs is proved by the nightly platform run.
          imported="^(src/|tests/|sidecar/|conftest\.py$|$packaging)"
          relevant=true
          if [ "$EVENT_NAME" = push ] && [ "${QUEUE_TESTED:-}" = true ]; then
            relevant=false
            reason="this commit passed windows-portability in the merge queue, which stands for this push"
          elif [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != merge_group ]; then
            reason="this $EVENT_NAME run proves the revision in full"
          elif [ "${FULL_LABEL:-false}" = true ]; then
            reason="the \`ci:full\` label runs every platform proof"
          else
            if [ "$EVENT_NAME" = merge_group ]; then base="${QUEUE_BASE_SHA:-}"; else base="${BASE_SHA:-}"; fi
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              reason="the diff base is unavailable, so the smoke runs"
            else
              files="$(git diff --name-only "$base" HEAD)"
              patch="$(git diff -U0 "$base" HEAD -- 'src/*.py')"
              changed="$(grep -E '^[+-]([^+-]|$)' <<< "$patch" | grep -E "$platform_lines" || true)"
              if hit="$(grep -E "$own" <<< "$files")"; then
                reason="this diff changes an input of the smoke: ${hit%%$'\n'*}"
              elif [ -n "$changed" ]; then
                line="${changed%%$'\n'*}"
                reason="this diff changes platform-specific Python: $(tr -d '\r`' <<< "${line:0:100}")"
              elif grep -E "$imported" <<< "$files" >/dev/null; then
                relevant=false
                reason="deferred to the nightly platform run on main: this diff changes what the smoke imports or runs, but none of its own inputs"
                if [ "$EVENT_NAME" = pull_request ]; then
                  reason="$reason (add the \`ci:full\` label to run it here)"
                fi
              else
                relevant=false
                reason="not affected: this diff changes nothing the smoke imports or runs"
              fi
            fi
          fi
          {
            echo "relevant=$relevant"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "### windows-portability ($EVENT_NAME): $reason" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  smoke:
    name: windows-portability smoke
    needs: changes
    # A failed `changes` job skips it and fails the required check below.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.relevant == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      FRISKET_NO_WORKER: "1"
      FRISKET_SECRETS_MASTER_KEY: "windows-portability-test-key-not-for-production"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - run: uv sync --dev --locked --extra asr
      - name: Import Windows-sensitive package graph
        run: >-
          uv run --no-sync python -c "import av; import cv2; import huggingface_hub; import onnx_asr; import onnxruntime; import rapidocr; import frisket; import frisket.cli; import frisket.operability.doctor.embeddings; import frisket.engine.jobs.queue; import frisket.engine.jobs.worker; import frisket.sdk.ops.transcribe_engines; import frisket.project_identity; import frisket.authoring.action_registry; import frisket.engine.sandbox; import frisket.engine.sandbox.broker; import frisket.engine.sandbox.shim; import frisket.team.security.secrets; import frisket.server.app; import frisket.server.services.projects; import frisket.server.workspace; import frisket.team.app; import frisket.team.team_bootstrap; import frisket.ops.ytdlp"
      - name: Run RapidOCR portable worker and session contracts
        run: >-
          uv run --no-sync pytest -q tests/engine/test_rapidocr_worker.py tests/engine/test_rapidocr_session.py
      - name: Run deployment self-probe
        run: uv run --no-sync frisket doctor
      - name: Run CSV and bulk-import portability contracts
        run: >-
          uv run --no-sync pytest -q tests/test_cli_main.py tests/runtime/test_model_server.py tests/runtime/test_model_install.py tests/runtime/test_model_recovery.py tests/runtime/test_environment_use.py tests/engine/test_blob_path_ingest.py tests/engine/test_import_csv_executor.py tests/engine/test_import_csv_typed_boundaries.py tests/server/test_server_import_bulk_routes.py tests/server/test_server_import_bulk_extensionless_email.py tests/server/test_server_import_bulk_email_parity.py
      - name: Run core store, queue, and locking subset
        run: >-
          uv run --no-sync pytest -q tests/ai/test_store.py::TestBasics::test_create_open_roundtrip tests/ai/test_store.py::TestConcurrentOpen::test_a_knob_change_mints_one_successor_not_one_per_open tests/engine/test_store_leases.py tests/engine/test_job_queue.py tests/engine/test_queue_memory_engines.py tests/team/test_byo_keys.py tests/engine/test_server.py::TestProjects::test_saved_action_concurrent_writes_keep_all_entries tests/server/test_action_registry_store.py tests/team/test_team_entrypoint_hardening.py::test_independent_process_boots_converge_to_one_organization tests/server/test_server_project_lifecycle_routes.py tests/engine/test_sandbox.py::TestBroker::test_sandboxed_op_completes_via_broker_without_keys
      - name: Run sandbox process-tree cancellation proof (native Windows Job Object teardown)
        # The descendant-marker proof for the cancellation contract: a sandboxed
        # parent spawns a grandchild (sometimes orphaned or TERM-ignoring);
        # cancellation / timeout / outer-cancel must tear down the whole tree
        # (Windows owns it via a kill-on-close Job Object) so the grandchild
        # never writes its marker. The interactive framed-process contract runs
        # beside it so Job assignment-before-I/O, graceful close, strict reap,
        # and interrupted exchange cleanup get the same native proof; these
        # cannot be proven by the POSIX/macOS local suite alone (contract
        # §"Platform proof").
        run: uv run --no-sync pytest -q tests/engine/test_sandbox_cancellation.py tests/engine/test_sandbox_process.py
      - name: Run headless private-runtime guardian proof
        run: uv run --no-sync pytest -q tests/runtime/test_windows_guard.py

  # The required check. It fails unless `changes` succeeded and the smoke
  # passed or was deliberately skipped; its summary says why it skipped.
  windows-portability:
    name: windows-portability
    if: ${{ always() }}
    needs: [changes, smoke]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "### $GITHUB_JOB: ${REASON:-the change filter did not finish}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          jq -e '.changes.result == "success" and ([.[] .result] | all(. == "success" or . == "skipped"))' <<< "$RESULTS"
