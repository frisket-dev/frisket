name: windows-portability

on:
  # `labeled` lets adding `ci:full` rerun the PR against the queue's input set.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer PR event supersedes the in-flight PR run. Every other run gets its
# own group, so no queue or push run is cancelled or held pending here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue-tested:
    permissions:
      actions: read
    uses: ./.github/workflows/queue-tested.yml
    with:
      workflow: windows-portability.yml
      job: windows-portability

  # Decides whether this run needs the Windows smoke.
  #   * Merge queue and `ci:full` PRs: the queue input set below, everything
  #     the smoke imports, installs or runs (the Python package, the tests,
  #     the sidecar the package ships, the locked dependencies and Python
  #     pin, the build hook and native vendor sources, and this workflow).
  #   * Other PRs (fast tier): the job's own inputs only (the Python runtime
  #     supervisor and Windows guardian, the sandbox process tree, the
  #     packaging and this workflow). A change to the rest of the queue set is
  #     deferred to the merge queue, which runs the smoke on what lands.
  #   * Pushes and manual dispatches always run, as before.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          packaging='pyproject\.toml$|uv\.lock$|\.python-version$|hatch_build\.py$|scripts/build_vec1\.py$|vendor/sqlite-vec1/|\.github/workflows/windows-portability\.yml$'
          queue_inputs="^(src/|tests/|sidecar/|conftest\.py$|$packaging)"
          pr_inputs="^(src/frisket/runtime/|src/frisket/engine/sandbox/|$packaging)"
          case "$EVENT_NAME" in
            merge_group)
              base="${QUEUE_BASE_SHA:-}"
              inputs="$queue_inputs" ;;
            pull_request)
              base="$BASE_SHA"
              if [ "${FULL_LABEL:-false}" = true ]; then inputs="$queue_inputs"; else inputs="$pr_inputs"; fi ;;
            *)
              echo 'relevant=true' >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          relevant=true
          reason="the diff base is unavailable, so the smoke runs"
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" HEAD)"
            if grep -E "$inputs" <<< "$files" >/dev/null; then
              reason="this diff changes an input of the smoke"
            elif [ "$inputs" = "$pr_inputs" ] && grep -E "$queue_inputs" <<< "$files" >/dev/null; then
              relevant=false
              reason="skipped on this PR: runs in the merge queue (add the \`ci:full\` label to run it here)"
            else
              relevant=false
              reason="skipped: this diff changes nothing the smoke imports or runs"
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "### windows-portability ($EVENT_NAME): $reason" >> "$summary"

  smoke:
    name: windows-portability smoke
    needs: [queue-tested, changes]
    # A push of the exact commit that passed in the merge queue skips the
    # rerun; a failed lookup still runs it. A failed `changes` job skips it
    # and fails the required check below.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.relevant == 'true' && needs.queue-tested.outputs.tested != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      FRISKET_NO_WORKER: "1"
      FRISKET_SECRETS_MASTER_KEY: "windows-portability-test-key-not-for-production"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - run: uv sync --dev --locked --extra asr
      - name: Import Windows-sensitive package graph
        run: >-
          uv run --no-sync python -c "import av; import cv2; import huggingface_hub; import onnx_asr; import onnxruntime; import rapidocr; import frisket; import frisket.cli; import frisket.operability.doctor.embeddings; import frisket.engine.jobs.queue; import frisket.engine.jobs.worker; import frisket.sdk.ops.transcribe_engines; import frisket.project_identity; import frisket.authoring.recipe_registry; import frisket.engine.sandbox; import frisket.engine.sandbox.broker; import frisket.engine.sandbox.shim; import frisket.team.security.secrets; import frisket.server.app; import frisket.server.services.projects; import frisket.server.workspace; import frisket.team.app; import frisket.team.team_bootstrap; import frisket.ops.ytdlp"
      - name: Run RapidOCR portable worker and session contracts
        run: >-
          uv run --no-sync pytest -q tests/engine/test_rapidocr_worker.py tests/engine/test_rapidocr_session.py
      - name: Run deployment self-probe
        run: uv run --no-sync frisket doctor
      - name: Run CSV and bulk-import portability contracts
        run: >-
          uv run --no-sync pytest -q tests/test_cli_main.py tests/runtime/test_model_server.py tests/runtime/test_model_install.py tests/runtime/test_model_recovery.py tests/runtime/test_environment_use.py tests/engine/test_blob_path_ingest.py tests/engine/test_import_csv_executor.py tests/engine/test_import_csv_typed_boundaries.py tests/server/test_server_import_bulk_routes.py tests/server/test_server_import_bulk_extensionless_email.py tests/server/test_server_import_bulk_email_parity.py
      - name: Run core store, queue, and locking subset
        run: >-
          uv run --no-sync pytest -q tests/ai/test_store.py::TestBasics::test_create_open_roundtrip tests/ai/test_store.py::TestConcurrentOpen::test_a_knob_change_mints_one_successor_not_one_per_open tests/engine/test_store_leases.py tests/engine/test_job_queue.py tests/engine/test_queue_memory_engines.py tests/team/test_byo_keys.py tests/engine/test_server.py::TestProjects::test_saved_recipe_concurrent_writes_keep_all_entries tests/server/test_recipe_registry.py tests/team/test_team_entrypoint_hardening.py::test_independent_process_boots_converge_to_one_org tests/server/test_server_project_lifecycle_routes.py tests/engine/test_sandbox.py::TestBroker::test_sandboxed_op_completes_via_broker_without_keys
      - name: Run sandbox process-tree cancellation proof (native Windows Job Object teardown)
        # The descendant-marker proof for the cancellation contract: a sandboxed
        # parent spawns a grandchild (sometimes orphaned or TERM-ignoring);
        # cancellation / timeout / outer-cancel must tear down the whole tree
        # (Windows owns it via a kill-on-close Job Object) so the grandchild
        # never writes its marker. The interactive framed-process contract runs
        # beside it so Job assignment-before-I/O, graceful close, strict reap,
        # and interrupted exchange cleanup get the same native proof; these
        # cannot be proven by the POSIX/macOS local suite alone (contract
        # §"Platform proof").
        run: uv run --no-sync pytest -q tests/engine/test_sandbox_cancellation.py tests/engine/test_sandbox_process.py
      - name: Run headless private-runtime guardian proof
        run: uv run --no-sync pytest -q tests/runtime/test_windows_guard.py

  # The required check. It fails unless `changes` succeeded and the smoke
  # passed or was deliberately skipped; why it skipped is in the `changes`
  # job summary.
  windows-portability:
    name: windows-portability
    if: ${{ always() }}
    needs: [changes, smoke]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '.changes.result == "success" and ([.[] .result] | all(. == "success" or . == "skipped"))' <<< "$RESULTS"
