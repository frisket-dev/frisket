name: windows-portability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: windows-portability
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      FRISKET_NO_WORKER: "1"
      FRISKET_SECRETS_MASTER_KEY: "windows-portability-test-key-not-for-production"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build native proof wheel and locked production requirements
        shell: pwsh
        run: |
          uv build --wheel --out-dir proof-dist
          New-Item -ItemType Directory -Force desktop/resources/python | Out-Null
          python -c "import pathlib,zipfile; wheel=next(pathlib.Path('proof-dist').glob('*.whl')); zipfile.ZipFile(wheel).extractall('desktop/resources/python')"
          uv export --frozen --no-dev --extra pdf --extra browser --no-emit-project --no-header --no-annotate --output-file desktop/resources/requirements.txt
      - name: Prove native guardian with locked application dependencies and packaged imports
        env:
          PYTHONPATH: desktop/resources/python
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: pwsh
        run: |
          uv run --no-project --with-requirements desktop/resources/requirements.txt --with pytest==9.0.3 python -c "import pathlib,frisket,frisket.engine.sandbox,platformdirs,importlib.metadata as m; print('packaged Core:',frisket.__file__); print('platformdirs:',platformdirs.__file__); print('pytest entrypoints:',[(e.name,e.value,str(e.dist._path)) for e in m.entry_points(group='pytest11')]); assert pathlib.Path(frisket.__file__).resolve().is_relative_to(pathlib.Path('desktop/resources/python').resolve())"
          uv run --no-project --with-requirements desktop/resources/requirements.txt --with pytest==9.0.3 python -m pytest --confcutdir tests/runtime -o addopts= -vv tests/runtime/test_windows_guard.py
