name: windows-portability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: windows-portability
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      FRISKET_NO_WORKER: "1"
      FRISKET_SECRETS_MASTER_KEY: "windows-portability-test-key-not-for-production"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - run: uv sync --dev --locked --extra asr
      - name: Diagnose native installer and filtered-environment guardian startup
        run: >-
          uv run --no-sync pytest -vv -s tests/runtime/test_windows_guard.py::test_windows_installer_guard_compiles_and_releases_exclusive_lease tests/runtime/test_windows_guard.py::test_spawn_service_starts_with_filtered_environment
